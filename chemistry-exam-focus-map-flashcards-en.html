<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>9CH0 Exam Focus Map Flashcards</title>
<style>
  :root{
    --bg:#0f1117; --panel:#181c26; --panel2:#1f2430; --border:#2b3140;
    --text:#e8ecf4; --muted:#8a92a6; --accent:#5eb3ff; --accent2:#ffb454;
    --good:#4ade80; --bad:#f87171; --trap:#f87171; --tip:#4ade80;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:40px;
  }
  header{
    padding:18px 16px 10px; text-align:center; position:sticky; top:0;
    background:linear-gradient(180deg,var(--bg) 80%,transparent); z-index:10;
  }
  h1{font-size:1.15rem; margin:0 0 2px; color:var(--accent);}
  .subtitle{font-size:.78rem; color:var(--muted); margin:0;}
  .progress-wrap{max-width:520px;margin:10px auto 0;padding:0 16px;}
  .progress-bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--good));width:0%;transition:width .3s;}
  .progress-label{font-size:.7rem;color:var(--muted);text-align:center;margin-top:4px;}

  .tabs{
    display:flex; gap:6px; overflow-x:auto; padding:12px 16px 4px;
    max-width:560px; margin:0 auto; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto; padding:7px 13px; border-radius:20px; font-size:.76rem;
    background:var(--panel); color:var(--muted); border:1px solid var(--border);
    white-space:nowrap; cursor:pointer; user-select:none;
  }
  .tab.active{background:var(--accent); color:#0f1117; border-color:var(--accent); font-weight:600;}

  .deck{max-width:520px; margin:10px auto; padding:0 16px;}
  .counter{text-align:center; font-size:.78rem; color:var(--muted); margin-bottom:8px;}

  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    min-height:280px; padding:22px 20px; position:relative; cursor:pointer;
    display:flex; flex-direction:column; justify-content:center;
    box-shadow:0 6px 20px rgba(0,0,0,.35);
  }
  .card-tag{
    position:absolute; top:12px; left:16px; font-size:.65rem; letter-spacing:.04em;
    color:var(--accent2); text-transform:uppercase; font-weight:700;
  }
  .card-side{font-size:.65rem; position:absolute; top:12px; right:16px; color:var(--muted);}
  .q-text{font-size:1.02rem; line-height:1.55; margin-top:14px; white-space:pre-wrap;}
  .a-text{font-size:.95rem; line-height:1.6; white-space:pre-wrap;}
  .a-text .trap{color:var(--trap); font-weight:600;}
  .a-text .tip{color:var(--tip); font-weight:600;}
  .hint{position:absolute; bottom:10px; left:0; right:0; text-align:center; font-size:.68rem; color:var(--muted);}
  .front{display:flex; flex-direction:column;}
  .back{display:none; flex-direction:column;}
  .card.flipped .front{display:none;}
  .card.flipped .back{display:flex;}

  .controls{display:flex; gap:10px; margin-top:14px;}
  .btn{
    flex:1; padding:12px 0; border-radius:12px; border:none; font-size:.85rem;
    font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-know{background:rgba(74,222,128,.15); color:var(--good); border:1px solid rgba(74,222,128,.4);}
  .btn-review{background:rgba(248,113,113,.15); color:var(--bad); border:1px solid rgba(248,113,113,.4);}
  .nav{display:flex; justify-content:space-between; margin-top:10px; gap:10px;}
  .nav button{
    flex:1; padding:10px 0; border-radius:12px; background:var(--panel2); color:var(--text);
    border:1px solid var(--border); font-size:.82rem; cursor:pointer;
  }
  .nav button:disabled{opacity:.35;}

  .status-pill{
    display:inline-block; font-size:.68rem; padding:2px 8px; border-radius:10px; margin-left:6px;
  }
  .pill-know{background:rgba(74,222,128,.18); color:var(--good);}
  .pill-review{background:rgba(248,113,113,.18); color:var(--bad);}

  .reset-row{text-align:center; margin-top:22px;}
  .reset-btn{
    background:none; border:1px solid var(--border); color:var(--muted); font-size:.72rem;
    padding:7px 14px; border-radius:10px; cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <h1>9CH0 Exam Focus Map</h1>
  <p class="subtitle">High-Frequency Topics × Common Traps × Exam Techniques</p>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 / 0 marked</div>
  </div>
</header>

<div class="tabs" id="tabs"></div>

<div class="deck">
  <div class="counter" id="counter"></div>
  <div class="card" id="card">
    <div class="card-tag" id="cardTag"></div>
    <div class="card-side" id="cardSide">Q</div>
    <div class="front">
      <div class="q-text" id="qText"></div>
      <div class="hint">Tap card to flip</div>
    </div>
    <div class="back">
      <div class="a-text" id="aText"></div>
      <div class="hint">Tap card to return to question</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-review" id="btnReview">✕ Needs Review</button>
    <button class="btn btn-know" id="btnKnow">✓ Got It</button>
  </div>

  <div class="nav">
    <button id="prevBtn">← Previous</button>
    <button id="nextBtn">Next →</button>
  </div>

  <div class="reset-row">
    <button class="reset-btn" id="resetBtn">Reset progress for this topic</button>
  </div>
</div>

<script>
const CARDS = [
{cat:"overview", q:"What are the three 9CH0 papers called, and how many marks/how much time does each have?", a:"Paper 1: Advanced Inorganic and Physical Chemistry, 90 marks / 105 minutes\nPaper 2: Advanced Organic and Physical Chemistry, 90 marks / 105 minutes\nPaper 3: General and Practical Principles in Chemistry, 120 marks / 150 minutes\n\n<span class='tip'>Note: Paper 3 has both the most marks and the most time, and is the most synthesis-heavy.</span>"},
{cat:"overview", q:"What is distinctive about Paper 3's question style? Why does it matter even if you haven't done the practicals yourself?", a:"Paper 3 tests experimental design, data handling, and uncertainty calculations, and often combines Paper 1+2 content into cross-topic integrated questions.\n\n<span class='tip'>It tests the chemistry principles behind an experiment, not hands-on skill — so solid theory alone can still score highly.</span>"},
{cat:"overview", q:"Which Topics does Paper 1 cover?", a:"Topics 1–10: atomic structure, bonding, redox, energetics I & II, equilibrium, acid-base/buffer solutions, halogens, transition metals."},
{cat:"overview", q:"Besides the organic chemistry core, what physical chemistry content appears in Paper 2?", a:"Kinetics and extended applications of equilibrium, often combined with organic reaction mechanisms."},

{cat:"born-haber", q:"How often does the Born-Haber cycle appear across the 12 mock papers? What does that tell you?", a:"12/12 — every single one. This is one of the highest-return revision topics; you must be able to draw it from scratch."},
{cat:"born-haber", q:"What's the difference between the 'formation' and 'dissociation' definitions of lattice enthalpy?", a:"Formation: ions combining into a solid, exothermic, negative value.\nDissociation: solid breaking apart into gaseous ions, endothermic, positive value.\nThe two are opposite in sign.\n\n<span class='trap'>Trap: which definition the question uses directly affects the arrow direction and sign throughout the cycle.</span>"},
{cat:"born-haber", q:"Before drawing a Born-Haber cycle, what should you check first?", a:"Circle whether the lattice enthalpy given in the question is a formation value or a dissociation value.\n\n<span class='tip'>Exam technique: getting this wrong flips the sign of the entire cycle.</span>"},
{cat:"born-haber", q:"What is the sign convention for dissociation enthalpy (e.g. bond enthalpy)?", a:"Always positive (endothermic), because breaking bonds requires absorbing energy."},

{cat:"redox", q:"How often do redox titration calculations appear in the mock papers? What are the common combinations?", a:"12/12. Common combinations: MnO4⁻/Fe²⁺ (1:5), Cr2O7²⁻/Fe²⁺ (1:6), H2O2/MnO4⁻."},
{cat:"redox", q:"What is the correct mole ratio for the Cr2O7²⁻/Fe²⁺ reaction? What's the most common wrong answer students give?", a:"The correct ratio is 1:6.\n\n<span class='trap'>Common trap: often misremembered as 1:1 or 1:3, because students memorise ratios instead of re-deriving them from the half-equations.</span>"},
{cat:"redox", q:"What is the correct step-by-step approach for any redox titration calculation?", a:"1) Write out both half-equations\n2) Balance the full equation using electron numbers\n3) Read off the true mole ratio\n\n<span class='tip'>Don't memorise ratios — re-derive them every time so you're not caught out by an unfamiliar combination.</span>"},

{cat:"transition", q:"What are the main areas covered under transition metal coordination chemistry?", a:"Colour origin (d-d transitions), ligand substitution, and geometric/optical isomerism (e.g. [Co(en)3]³⁺, cisplatin)."},
{cat:"transition", q:"Why are Sc³⁺ and Zn²⁺ colourless?", a:"Because their d-orbitals are either completely empty (d⁰) or completely full (d¹⁰), so no d-d transition is possible to absorb visible light.\n\n<span class='trap'>Trap: students often overlook this and assume all transition metal ions are coloured.</span>"},
{cat:"transition", q:"Before judging isomerism in a coordination compound, what should you do first?", a:"First count the central ion's d-electrons (to check for colour), then confirm the coordination number and geometry (octahedral/tetrahedral/square planar) before attempting an isomer diagram."},
{cat:"transition", q:"What type of isomerism do [Co(en)3]³⁺ and cisplatin each demonstrate?", a:"[Co(en)3]³⁺: optical isomerism, because en is a bidentate ligand forming a non-superimposable mirror-image structure.\nCisplatin: geometric (cis/trans) isomerism, seen in square planar coordination compounds."},

{cat:"buffer", q:"What is the most common question format for buffer solution pH calculations?", a:"'Weak acid + partial neutralisation by NaOH' or 'weak base + partial neutralisation by strong acid'."},
{cat:"buffer", q:"When tackling a weak-base buffer question, which step is most often missed?", a:"Forgetting to first convert pKb to pKa (pKa + pKb = pKw = 14 at 25°C), and mistakenly substituting pKb directly into Henderson-Hasselbalch.\n\n<span class='trap'>This is the most common mark-loss point in weak-base buffer questions.</span>"},
{cat:"buffer", q:"What is the correct step-by-step method for calculating buffer solution pH?", a:"1) Write out the neutralisation equation\n2) Use an ICE table to find the remaining moles of weak acid/base and the moles of conjugate produced\n3) Substitute into the Henderson-Hasselbalch equation\n\n<span class='tip'>Don't use starting concentrations directly — you must first subtract what was consumed by neutralisation.</span>"},

{cat:"kp-kc", q:"Which equilibrium systems are commonly used to set Kp/Kc calculation questions?", a:"Haber process (N2+3H2⇌2NH3), Contact process (2SO2+O2⇌2SO3), N2O4⇌2NO2, and similar systems."},
{cat:"kp-kc", q:"Does a catalyst change the value of Kp or Kc? Why?", a:"No. A catalyst only provides an alternative pathway with lower activation energy, speeding up how quickly both forward and reverse reactions reach equilibrium — it does not shift the equilibrium position, so Kp/Kc stays unchanged.\n\n<span class='tip'>Stating this explicitly in your answer secures the concept mark.</span>"},
{cat:"kp-kc", q:"What is the most common calculation trap when using mole fraction to find Kp?", a:"Forgetting to first calculate total moles, and directly substituting individual species' moles as if they were mole fractions without dividing by the total."},

{cat:"kinetics", q:"What does a kinetics mechanism-matching (rate-determining step) question ask students to do?", a:"Given a set of experimental rate data, first derive the rate law (the order with respect to each reactant), then judge which suggested mechanism's slow step is consistent with that rate law."},
{cat:"kinetics", q:"What is the common mistake when checking whether a mechanism matches the rate law?", a:"Only checking which species appear in the mechanism's slow step, while ignoring whether the reaction orders in the rate law actually match.\n\n<span class='trap'>Trap: the species may be right but if the order doesn't match, the mechanism still doesn't hold.</span>"},
{cat:"kinetics", q:"What is the correct approach for a mechanism-matching question?", a:"1) Independently derive the rate law from the data\n2) Check each suggested mechanism's slow step to see whether both the species involved and their orders fully match the rate law"},

{cat:"vsepr-amphoteric", q:"Which 'less-common' molecules are often used to test VSEPR molecular shapes?", a:"Molecules like PCl5 (trigonal bipyramidal) and SF6 (octahedral), which have more than 4 electron pairs around the central atom and require multi-angle judgement of bond angles."},
{cat:"vsepr-amphoteric", q:"Which oxides/hydroxides are amphoteric and dissolve in excess strong alkali?", a:"Al2O3 and Cr(OH)3 dissolve in excess NaOH.\n\n<span class='trap'>Contrast trap: Fe(OH)3 does not dissolve in excess NaOH (it's only basic, not amphoteric) — examiners often use this contrast to test understanding.</span>"},

{cat:"misconceptions", q:"How should a catalyst be shown on a Maxwell-Boltzmann distribution diagram?", a:"Draw 'the same curve, with two different Ea markers' (the uncatalysed Ea and the lower catalysed Ea'), not two separate curves.\n\n<span class='trap'>This is one of the most common diagram misconceptions.</span>"},
{cat:"misconceptions", q:"What is the most commonly overlooked trap before calculating ΔG° = ΔH° − TΔS°?", a:"ΔH° is usually in kJ mol⁻¹ while ΔS° is in J mol⁻¹ K⁻¹ — you must convert to matching units before substituting (usually by dividing ΔS° by 1000 to get kJ)."},
{cat:"misconceptions", q:"What should the number of significant figures in an answer be based on?", a:"It should follow the fewest significant figures given among the data in the question, not the number of digits shown on a calculator display."},
{cat:"misconceptions", q:"What effect does a catalyst have on the equilibrium position and on Kp/Kc?", a:"None whatsoever. A catalyst only affects the rate of reaching equilibrium — it does not affect the equilibrium position or change the Kp/Kc value."},

{cat:"checklist", q:"Pre-exam self-check: can you draw a Born-Haber cycle from scratch for at least 5 different compounds?", a:"If not, start practising with the simplest examples like NaCl and KCl, then move on to CaCl2, Na2O, and MgCl2, which involve double charges or extra steps."},
{cat:"checklist", q:"Pre-exam self-check: can you balance any redox half-equation on the spot, without relying on memorised ratios?", a:"Practice method: randomly pick an oxidising agent/reducing agent pair and, within 2 minutes, balance the half-equations and write the overall equation and mole ratio."},
{cat:"checklist", q:"Pre-exam self-check: can you explain why Sc³⁺/Zn²⁺ are colourless while Ti³⁺/Cu²⁺ are coloured?", a:"The key to explaining it: count the d-electrons first — d⁰ or d¹⁰ means no d-d transition, hence colourless; d¹–d⁹ allows a d-d transition that absorbs visible light, producing colour."},
{cat:"checklist", q:"Pre-exam self-check: do you remember that a catalyst affects neither Kp/Kc nor the equilibrium position — only the rate?", a:"This is a core concept running through multiple topics — make sure you actively state it in any relevant question to secure the concept mark."},
];

const CATS = [
  {id:"all", label:"All"},
  {id:"overview", label:"Paper Overview"},
  {id:"born-haber", label:"Born-Haber"},
  {id:"redox", label:"Redox Titrations"},
  {id:"transition", label:"Transition Metals"},
  {id:"buffer", label:"Buffers"},
  {id:"kp-kc", label:"Kp/Kc"},
  {id:"kinetics", label:"Kinetics Mechanisms"},
  {id:"vsepr-amphoteric", label:"VSEPR/Amphoteric"},
  {id:"misconceptions", label:"Misconceptions"},
  {id:"checklist", label:"Pre-Exam Checklist"},
];

const STORAGE_KEY = "chemExamFocusMapProgressEN";
let progress = {};
try{ progress = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }catch(e){ progress = {}; }
CARDS.forEach((c,i)=>{ c.id = i; });

let currentCat = "all";
let filtered = CARDS.slice();
let idx = 0;
let flipped = false;

const tabsEl = document.getElementById("tabs");
const cardEl = document.getElementById("card");
const qText = document.getElementById("qText");
const aText = document.getElementById("aText");
const cardTag = document.getElementById("cardTag");
const counter = document.getElementById("counter");
const progressFill = document.getElementById("progressFill");
const progressLabel = document.getElementById("progressLabel");

function catLabel(id){ const c = CATS.find(x=>x.id===id); return c ? c.label : id; }

function renderTabs(){
  tabsEl.innerHTML = "";
  CATS.forEach(c=>{
    const btn = document.createElement("div");
    btn.className = "tab" + (c.id===currentCat ? " active" : "");
    btn.textContent = c.label;
    btn.onclick = ()=>{ currentCat = c.id; applyFilter(); };
    tabsEl.appendChild(btn);
  });
}

function applyFilter(){
  filtered = currentCat==="all" ? CARDS.slice() : CARDS.filter(c=>c.cat===currentCat);
  idx = 0; flipped = false;
  renderTabs();
  renderCard();
  updateProgress();
}

function renderCard(){
  if(filtered.length===0){
    qText.innerHTML = "No cards in this category";
    aText.innerHTML = "";
    counter.textContent = "";
    cardTag.textContent = "";
    return;
  }
  const c = filtered[idx];
  cardEl.classList.toggle("flipped", flipped);
  cardTag.textContent = catLabel(c.cat);
  qText.innerHTML = c.q;
  aText.innerHTML = c.a;
  const status = progress[c.id];
  let statusHtml = "";
  if(status==="know") statusHtml = " <span class='status-pill pill-know'>Got It</span>";
  if(status==="review") statusHtml = " <span class='status-pill pill-review'>Review</span>";
  counter.innerHTML = (idx+1) + " / " + filtered.length + statusHtml;
  document.getElementById("cardSide").textContent = flipped ? "A" : "Q";
  document.getElementById("prevBtn").disabled = idx===0;
  document.getElementById("nextBtn").disabled = idx===filtered.length-1;
}

function updateProgress(){
  const total = CARDS.length;
  const done = Object.keys(progress).length;
  const pct = total ? Math.round((done/total)*100) : 0;
  progressFill.style.width = pct + "%";
  progressLabel.textContent = done + " / " + total + " marked";
}

function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }catch(e){}
}

cardEl.addEventListener("click", ()=>{
  if(filtered.length===0) return;
  flipped = !flipped;
  renderCard();
});

document.getElementById("prevBtn").onclick = (e)=>{
  e.stopPropagation();
  if(idx>0){ idx--; flipped=false; renderCard(); }
};
document.getElementById("nextBtn").onclick = (e)=>{
  e.stopPropagation();
  if(idx<filtered.length-1){ idx++; flipped=false; renderCard(); }
};
document.getElementById("btnKnow").onclick = (e)=>{
  e.stopPropagation();
  if(filtered.length===0) return;
  progress[filtered[idx].id] = "know";
  saveProgress(); updateProgress(); renderCard();
};
document.getElementById("btnReview").onclick = (e)=>{
  e.stopPropagation();
  if(filtered.length===0) return;
  progress[filtered[idx].id] = "review";
  saveProgress(); updateProgress(); renderCard();
};
document.getElementById("resetBtn").onclick = (e)=>{
  e.stopPropagation();
  if(!confirm("Reset progress for the current category?")) return;
  filtered.forEach(c=>{ delete progress[c.id]; });
  saveProgress(); updateProgress(); renderCard();
};

applyFilter();
</script>
</body>
</html>
