<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chemistry Mock Paper 7 — Flashcards</title>
<style>
  :root{
    --bg:#0a0e17; --bg2:#0f1524; --card:#141b2d; --card2:#182238;
    --accent:#2dd4bf; --accent2:#22b8a3; --amber:#fbbf24; --red:#f87171;
    --green:#4ade80; --text:#e5e9f0; --muted:#8b95a8; --border:#243044;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh;padding-bottom:40px;}
  header{padding:18px 16px 10px;text-align:center;position:sticky;top:0;background:rgba(10,14,23,0.96);
    backdrop-filter:blur(8px);z-index:20;border-bottom:1px solid var(--border);}
  h1{font-size:1.15rem;margin:0 0 2px;background:linear-gradient(90deg,var(--accent),#818cf8);
    -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;}
  .sub{font-size:0.72rem;color:var(--muted);margin-bottom:10px;}
  .progress-wrap{max-width:520px;margin:0 auto;}
  .progress-bar{height:6px;background:var(--border);border-radius:6px;overflow:hidden;margin-top:6px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#818cf8);width:0%;transition:width .3s;}
  .stats{display:flex;justify-content:center;gap:14px;margin-top:6px;font-size:0.68rem;color:var(--muted);}
  .stats span.k{color:var(--green);} .stats span.r{color:var(--red);}
  .tabs{display:flex;overflow-x:auto;gap:6px;padding:10px 12px 4px;max-width:560px;margin:0 auto;
    -ms-overflow-style:none;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;padding:7px 13px;border-radius:20px;background:var(--card);border:1px solid var(--border);
    color:var(--muted);font-size:0.72rem;font-weight:600;white-space:nowrap;cursor:pointer;}
  .tab.active{background:linear-gradient(90deg,var(--accent),#22b8a3);color:#04211c;border-color:transparent;}
  main{max-width:560px;margin:0 auto;padding:14px 14px 0;}
  .counter{text-align:center;font-size:0.75rem;color:var(--muted);margin-bottom:8px;}
  .deck{position:relative;height:420px;}
  .card{position:absolute;inset:0;background:var(--card);border:1px solid var(--border);border-radius:18px;
    padding:20px;display:flex;flex-direction:column;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,0.35);
    transition:transform .15s;overflow:hidden;}
  .card:active{transform:scale(0.985);}
  .tagrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .qid{font-size:0.68rem;font-weight:800;color:var(--accent);letter-spacing:.5px;}
  .marks{font-size:0.65rem;background:var(--card2);color:var(--amber);padding:3px 9px;border-radius:10px;
    font-weight:700;border:1px solid var(--border);}
  .topicchip{font-size:0.62rem;color:var(--muted);background:var(--bg2);padding:2px 8px;border-radius:8px;margin-top:2px;display:inline-block;}
  .content{flex:1;overflow-y:auto;font-size:0.92rem;line-height:1.55;padding-right:2px;}
  .content b{color:var(--accent);}
  .content .tip{margin-top:10px;padding:9px 10px;background:rgba(251,191,36,0.08);border-left:3px solid var(--amber);
    border-radius:6px;font-size:0.8rem;color:#fde68a;}
  .content .trap{margin-top:8px;padding:9px 10px;background:rgba(248,113,113,0.08);border-left:3px solid var(--red);
    border-radius:6px;font-size:0.8rem;color:#fecaca;}
  .content .eq{font-family:'Courier New',monospace;background:var(--bg2);padding:8px 10px;border-radius:8px;
    margin:6px 0;font-size:0.85rem;color:#93e8db;border:1px solid var(--border);}
  .fliphint{text-align:center;font-size:0.65rem;color:var(--muted);margin-top:8px;}
  .backface{background:var(--card2);}
  .actions{display:flex;gap:10px;margin-top:12px;}
  .btn{flex:1;padding:11px;border-radius:12px;border:none;font-weight:700;font-size:0.85rem;cursor:pointer;}
  .btn.review{background:rgba(248,113,113,0.15);color:var(--red);border:1px solid rgba(248,113,113,0.4);}
  .btn.know{background:rgba(74,222,128,0.15);color:var(--green);border:1px solid rgba(74,222,128,0.4);}
  .btn.review.sel{background:var(--red);color:#1a0505;}
  .btn.know.sel{background:var(--green);color:#052712;}
  .navrow{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;}
  .navbtn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 18px;
    border-radius:12px;font-size:0.85rem;font-weight:700;cursor:pointer;}
  .navbtn:disabled{opacity:0.3;}
  .resetrow{text-align:center;margin-top:18px;}
  .resetbtn{background:none;border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:10px;
    font-size:0.7rem;cursor:pointer;}
  table.mini{width:100%;border-collapse:collapse;margin:6px 0;font-size:0.78rem;}
  table.mini td,table.mini th{border:1px solid var(--border);padding:4px 6px;text-align:left;}
  table.mini th{background:var(--bg2);color:var(--accent);}
</style>
</head>
<body>
<header>
  <h1>🧪 Chemistry Mock Paper 7</h1>
  <div class="sub">Edexcel 9CH0/01 · Advanced Inorganic &amp; Physical Chemistry · 90 marks · for Jody</div>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="stats">
      <span>Total: <b id="statTotal">0</b></span>
      <span class="k">Know: <span id="statKnow">0</span></span>
      <span class="r">Review: <span id="statReview">0</span></span>
    </div>

</header>

<div class="tabs" id="tabs"></div>

<main>
  <div class="counter" id="counter"></div>
  <div class="deck">
    <div class="card" id="cardEl" onclick="flipCard()"></div>
  </div>

    <button class="navbtn" id="prevBtn" onclick="prevCard()">← Prev</button>

    <button class="navbtn" id="nextBtn" onclick="nextCard()">Next →</button>
  </div>
  <div class="resetrow"><button class="resetbtn" onclick="resetProgress()">Reset all progress</button></div>
</main>

<script>
const cards = [
/* ===== SECTION A — MULTIPLE CHOICE (1 mark each) ===== */
{id:'A1',section:'A',topic:'Transition Metals',marks:1,
 q:'<b>Q1.</b> Which aqueous transition metal ion is colourless?<br><br>A. [Cu(H₂O)₆]²⁺&nbsp;&nbsp; B. [Ni(H₂O)₆]²⁺&nbsp;&nbsp; C. [Zn(H₂O)₆]²⁺&nbsp;&nbsp; D. [Co(H₂O)₆]²⁺',
 a:'<b>Answer: C — [Zn(H₂O)₆]²⁺</b><br>Zn²⁺ is d¹⁰ — a completely full d subshell, so no d–d transitions are possible and no visible light is absorbed.'},

{id:'A2',section:'A',topic:'Bonding',marks:1,
 q:'<b>Q2.</b> Which substance has the most exothermic lattice enthalpy of formation?<br><br>A. KCl&nbsp;&nbsp; B. NaBr&nbsp;&nbsp; C. SrO&nbsp;&nbsp; D. BaO',
 a:'<b>Answer: C — SrO</b><br>SrO has higher ionic charges (+2/−2) than the Group 1 halides KCl/NaBr, AND Sr²⁺ is smaller than Ba²⁺ — both factors combine to give the most exothermic lattice enthalpy of the four.'},

{id:'A3',section:'A',topic:'Redox I',marks:1,
 q:'<b>Q3.</b> In 2Fe²⁺ + Cl₂ → 2Fe³⁺ + 2Cl⁻, the underlined Fe²⁺ is acting as:<br><br>A. an oxidising agent<br>B. a reducing agent<br>C. a catalyst<br>D. an electrolyte',
 a:'<b>Answer: B — a reducing agent</b><br>Fe²⁺ loses an electron (is oxidised to Fe³⁺) — a species that gets oxidised is, by definition, the reducing agent.'},

{id:'A4',section:'A',topic:'Equilibrium II',marks:1,
 q:'<b>Q4.</b> For the exothermic equilibrium N₂(g)+3H₂(g)⇌2NH₃(g), what is the effect of increasing temperature?<br><br>A. Kp increases<br>B. Kp decreases<br>C. The equilibrium yield of NH₃ increases<br>D. Kp is unchanged',
 a:'<b>Answer: B — Kp decreases</b><br>The forward reaction is exothermic, so increasing T shifts equilibrium LEFT (favouring the endothermic reverse reaction), giving less NH₃ relative to N₂/H₂ at equilibrium — a smaller Kp.'},

{id:'A5',section:'A',topic:'Periodicity',marks:1,
 q:'<b>Q5.</b> Which Period 3 oxide is acidic?<br><br>A. Na₂O&nbsp;&nbsp; B. MgO&nbsp;&nbsp; C. Al₂O₃&nbsp;&nbsp; D. SO₂',
 a:'<b>Answer: D — SO₂</b><br>SO₂ is a non-metal oxide, reacting with bases to form salts (acidic). Na₂O and MgO are basic; Al₂O₃ is amphoteric.'},

{id:'A6',section:'A',topic:'Acid-Base',marks:1,
 q:'<b>Q6.</b> What is the pH of a buffer with EQUAL concentrations of ethanoic acid and sodium ethanoate? (Ka=1.7×10⁻⁵)<br><br>A. 2.87&nbsp;&nbsp; B. 4.77&nbsp;&nbsp; C. 7.00&nbsp;&nbsp; D. 9.13',
 a:'<div class="eq">pH = pKa + log(1) = pKa = −log(1.7×10⁻⁵) = <b>4.77</b></div><b>Answer: B</b>'},

{id:'A7',section:'A',topic:'Transition Metals',marks:1,
 q:'<b>Q7.</b> Which complex ion exhibits geometrical (cis/trans) isomerism?<br><br>A. [Co(NH₃)₆]³⁺&nbsp;&nbsp; B. [Co(NH₃)₄Cl₂]⁺&nbsp;&nbsp; C. [Cu(NH₃)₄(H₂O)₂]²⁺&nbsp;&nbsp; D. [CoCl₄]²⁻',
 a:'<b>Answer: B — [Co(NH₃)₄Cl₂]⁺</b><br>TWO different types of ligand (NH₃ and Cl) can be arranged either adjacent (cis) or opposite (trans). The other complexes either have only one ligand type, or (D) is tetrahedral, which has no geometrical isomers.'},

{id:'A8',section:'A',topic:'Kinetics',marks:1,
 q:'<b>Q8.</b> Rate = k[A]². If [A] is doubled, the rate:<br><br>A. doubles&nbsp;&nbsp; B. halves&nbsp;&nbsp; C. quadruples&nbsp;&nbsp; D. stays the same',
 a:'<div class="eq">rate = k(2[A])² = 4 × k[A]²</div><b>Answer: C — quadruples</b>'},

{id:'A9',section:'A',topic:'Energetics',marks:1,
 q:'<b>Q9.</b> Which process has a POSITIVE ΔS?<br><br>A. H₂O(g) → H₂O(l)<br>B. NaCl(s) → NaCl(aq)<br>C. 2H₂(g)+O₂(g) → 2H₂O(l)<br>D. N₂(g)+3H₂(g) → 2NH₃(g)',
 a:'<b>Answer: B — NaCl(s) → NaCl(aq)</b><br>A solid dissolving into free-moving ions in solution is an increase in disorder / more ways to distribute energy. (A, C, and D all involve a DECREASE in gas moles/disorder — gas condensing to liquid, or fewer moles of gas overall.)'},

{id:'A10',section:'A',topic:'Redox II',marks:1,
 q:'<b>Q10.</b> E°(Fe³⁺/Fe²⁺)=+0.77V, E°(I₂/I⁻)=+0.54V. What is E°cell for the reaction between Fe³⁺ and I⁻?<br><br>A. +0.23 V&nbsp;&nbsp; B. −0.23 V&nbsp;&nbsp; C. +1.31 V&nbsp;&nbsp; D. +0.31 V',
 a:'<div class="eq">E°cell = E°(reduction) − E°(oxidation) = 0.77 − 0.54 = <b>+0.23 V</b></div><b>Answer: A</b>'},

/* ===== SECTION B ===== */
{id:'B11a',section:'B',topic:'Atomic Structure',marks:2,
 q:'<b>Q11(a)</b> Define the term <i>first ionisation energy</i>. [2]',
 a:'<b>Model answer:</b><br>The energy required to remove ONE electron from each atom ✓<br>in ONE MOLE of gaseous atoms ✓'},

{id:'B11b',section:'B',topic:'Atomic Structure',marks:1,
 q:'<b>Q11(b)</b> Write an equation, including state symbols, for the first ionisation energy of phosphorus. [1]',
 a:'<div class="eq">P(g) → P⁺(g) + e⁻</div>✓'},

{id:'B11c',section:'B',topic:'Atomic Structure',marks:2,
 q:'<b>Q11(c)</b> Explain why the first ionisation energy of sulfur is lower than that of phosphorus. [max 2]',
 a:'<b>Model answer:</b><br>P: [Ne]3s²3p³ — half-filled 3p sub-shell, a relatively stable arrangement ✓<br>S: [Ne]3s²3p⁴ — the extra electron pairs up in a 3p orbital, experiencing repulsion from its paired partner, so less energy is needed to remove it ✓'},

{id:'B12a',section:'B',topic:'Bonding',marks:2,
 q:'<b>Q12(a)</b> Draw a dot-and-cross diagram for PCl₃, outer electrons only. [2]',
 a:'<b>Model answer:</b><br>Three P–Cl bonds, each shown as a shared pair (2 electrons) ✓<br>One lone pair shown on phosphorus ✓'},

{id:'B12b',section:'B',topic:'Bonding',marks:3,
 q:'<b>Q12(b)</b> State the shape of PCl₃ and its bond angle. Explain using electron pair repulsion. [max 3]',
 a:'<b>Shape: trigonal pyramidal</b> ✓ &nbsp; <b>Bond angle: 107°</b> ✓<br>Three bonding pairs + one lone pair around P; lone pair–bonding pair repulsion is greater than bonding pair–bonding pair repulsion, squeezing the angle below 109.5° ✓'},

{id:'B13a',section:'B',topic:'Halogens',marks:2,
 q:'<b>Q13(a)</b> Write an ionic equation for the reaction between chlorine and COLD DILUTE NaOH. Name the type of reaction. [2]',
 a:'<div class="eq">Cl₂(aq) + 2OH⁻(aq) → Cl⁻(aq) + ClO⁻(aq) + H₂O(l)</div>✓<br>Type of reaction: <b>disproportionation</b> ✓ (Cl goes from 0 to both −1 and +1 simultaneously)'},

{id:'B13b',section:'B',topic:'Halogens',marks:1,
 q:'<b>Q13(b)</b> Write an equation for the reaction between chlorine and HOT CONCENTRATED NaOH. [1]',
 a:'<div class="eq">3Cl₂(g) + 6OH⁻(aq) → 5Cl⁻(aq) + ClO₃⁻(aq) + 3H₂O(l)</div>✓<div class="tip">💡 Cold dilute NaOH gives ClO⁻ (chlorate(I), the bleach ion). Hot concentrated NaOH gives ClO₃⁻ (chlorate(V)) instead — different conditions, different disproportionation products. Learn BOTH equations separately.</div>'},

{id:'B13c',section:'B',topic:'Halogens',marks:2,
 q:'<b>Q13(c)</b> Explain why iodide ions are stronger reducing agents than bromide ions. [max 2]',
 a:'<b>Model answer:</b><br>I⁻ has a larger ionic radius than Br⁻ ✓<br>Weaker attraction for its outer electrons (more shielding, further from nucleus) / I₂/I⁻ has a less positive E° value than Br₂/Br⁻ ✓<br>So I⁻ more readily loses electrons — it is more easily oxidised.'},

{id:'B14a',section:'B',topic:'Energetics I',marks:2,
 q:'<b>Q14(a)</b> Define the term <i>standard enthalpy change of formation</i>. [2]',
 a:'<b>Model answer:</b><br>The enthalpy change when ONE MOLE of a compound is formed ✓<br>from its elements in their standard states, under standard conditions ✓'},

{id:'B14b',section:'B',topic:'Energetics I',marks:2,
 q:'<b>Q14(b)</b> Calculate ΔH for: C₂H₄(g)+H₂O(g)→C₂H₅OH(g), using ΔH°f[C₂H₄]=+52, ΔH°f[H₂O(g)]=−242, ΔH°f[C₂H₅OH(g)]=−235 (kJ/mol). [2]',
 a:'<div class="eq">ΔH = ΣΔH°f(products) − ΣΔH°f(reactants)<br>= (−235) − [(+52) + (−242)]<br>= −235 − (−190) = <b>−45 kJ mol⁻¹</b></div>✓✓'},

{id:'B14c',section:'B',topic:'Energetics I',marks:1,
 q:'<b>Q14(c)</b> Suggest one reason why a ΔH value calculated from standard enthalpies of formation might differ from one calculated using mean bond enthalpies. [1]',
 a:'<b>Model answer:</b><br>Standard enthalpies of formation refer to substances in their actual standard states (which may be liquid/solid) ✓ — mean bond enthalpies are AVERAGE values taken across many different compounds and apply only to the gaseous state, so they don\'t capture the specific compound\'s real bonding environment exactly.'},

{id:'B15a',section:'B',topic:'Stoichiometry',marks:1,
 q:'<b>Q15(a)</b> Write an equation, including state symbols, for the thermal decomposition of calcium carbonate. [1]',
 a:'<div class="eq">CaCO₃(s) → CaO(s) + CO₂(g)</div>✓'},

{id:'B15b',section:'B',topic:'Stoichiometry',marks:3,
 q:'<b>Q15(b)</b> 2.00 g of impure CaCO₃ was heated to constant mass; the solid residue had mass 1.30 g. Calculate the % purity of the CaCO₃. [3]',
 a:'<div class="eq">Mass loss = 2.00 − 1.30 = 0.70 g CO₂ ✓<br>n(CO₂) = 0.70/44.0 = 0.0159 mol ✓<br>n(CaCO₃) = 0.0159 mol (1:1 ratio); mass = 0.0159 × 100.1 = 1.59 g<br>% purity = (1.59/2.00) × 100 = <b>79.5%</b> ✓</div>'},

{id:'B15c',section:'B',topic:'Stoichiometry',marks:1,
 q:'<b>Q15(c)</b> State one assumption you made in your calculation. [1]',
 a:'<b>Any one:</b> all the CO₂ evolved was lost (none trapped in the solid) ✓ — OR there were no side reactions ✓ — OR CaCO₃ decomposition was the only source of mass loss ✓'},

{id:'B16a',section:'B',topic:'Kinetics',marks:1,
 q:'<b>Q16(a)</b> A first-order reaction has a half-life of 120 s. Calculate the rate constant, k, with units. [1]',
 a:'<div class="eq">k = ln2 / t½ = 0.693 / 120 = <b>5.78×10⁻³ s⁻¹</b></div>✓ (accept 5.7–5.8×10⁻³)'},

{id:'B16b',section:'B',topic:'Kinetics',marks:2,
 q:'<b>Q16(b)</b> If the initial [A] is 0.40 mol dm⁻³, calculate [A] after 360 s. [2]',
 a:'<div class="eq">360 s = 3 half-lives (120×3) ✓<br>[A] = 0.40 × (½)³ = 0.40 × 1/8 = <b>0.050 mol dm⁻³</b> ✓</div><div class="tip">💡 For first-order reactions, always check whether the elapsed time is a whole-number multiple of the half-life first — it makes the calculation instant, no need for the full integrated rate equation.</div>'},

{id:'B16c',section:'B',topic:'Kinetics',marks:1,
 q:'<b>Q16(c)</b> Sketch a graph showing how [A] changes with time. Label the half-life on your graph. [1]',
 a:'<b>Model answer:</b><br>Exponential decay curve starting at 0.40 mol dm⁻³, approaching zero asymptotically (never quite reaching it) ✓<br>t½ marked at each halving point: 0.40→0.20 (first t½), 0.20→0.10 (second t½), 0.10→0.05 (third t½) — all equal time intervals of 120 s'},

{id:'B16d',section:'B',topic:'Kinetics',marks:2,
 q:'<b>Q16(d)</b> Explain why increasing the temperature increases the rate constant of a reaction. [2]',
 a:'<b>Model answer:</b><br>More molecules have energy ≥ the activation energy at higher temperature (the Maxwell-Boltzmann distribution shifts) ✓<br>A greater PROPORTION of collisions are therefore successful (have enough energy to react) ✓'},

{id:'B17a',section:'B',topic:'Equilibrium I',marks:1,
 q:'<b>Q17(a)</b> Write the Kc expression for: CO(g)+H₂O(g)⇌CO₂(g)+H₂(g) [1]',
 a:'<div class="eq">Kc = [CO₂][H₂] / ([CO][H₂O])</div>✓'},

{id:'B17b',section:'B',topic:'Equilibrium I',marks:3,
 q:'<b>Q17(b)</b> 0.20 mol CO + 0.20 mol H₂O in a 1.0 dm³ container reach equilibrium at 1000K, Kc=1.0. Calculate the equilibrium concentration of each species. [3]',
 a:'<div class="eq">Let x = amount reacted.<br>Kc = x² / (0.20−x)² = 1.0 ✓<br>Taking square roots: x / (0.20−x) = 1.0 → x = 0.20−x → x = <b>0.10 mol dm⁻³</b> ✓<br>[CO] = [H₂O] = 0.20−0.10 = 0.10 mol dm⁻³<br>[CO₂] = [H₂] = 0.10 mol dm⁻³ ✓</div><div class="tip">💡 When Kc = 1 exactly, you can take the square root directly instead of expanding the quadratic — a huge time-saver if you spot it.</div>'},

{id:'B17c',section:'B',topic:'Acid-Base',marks:1,
 q:'<b>Q17(c)</b> Calculate the pH of 0.050 mol dm⁻³ sulfuric acid, H₂SO₄. [1]',
 a:'<div class="eq">[H⁺] = 2 × 0.050 = 0.10 mol dm⁻³ (diprotic)<br>pH = <b>1.0</b></div>✓'},

{id:'B17d',section:'B',topic:'Acid-Base',marks:3,
 q:'<b>Q17(d)</b> A buffer contains 0.10 mol dm⁻³ ammonia and 0.15 mol dm⁻³ ammonium chloride. Calculate the pH. (Kb for NH₃ = 1.8×10⁻⁵) [3]',
 a:'<div class="eq">pKb = −log(1.8×10⁻⁵) = 4.74<br>pKa(NH₄⁺) = 14 − 4.74 = 9.26 ✓<br>pH = pKa + log([base]/[acid]) = 9.26 + log(0.10/0.15) ✓<br>= 9.26 − 0.176 = <b>9.08</b> ✓</div><div class="tip">💡 For a base/conjugate-acid buffer (like NH₃/NH₄⁺), first convert Kb → pKb → pKa(conjugate acid) = 14−pKb, THEN apply Henderson-Hasselbalch as normal. Never use pKb directly in the pH=pKa+log formula.</div>'},

{id:'B17e',section:'B',topic:'Acid-Base',marks:2,
 q:'<b>Q17(e)</b> Explain, with an equation, how this buffer resists a pH change when a small amount of acid is added. [2]',
 a:'<div class="eq">NH₃ + H⁺ → NH₄⁺</div>✓ Added H⁺ is neutralised by the ammonia (base) component.<br>The ratio [NH₃]/[NH₄⁺] changes only slightly, so pH remains approximately constant ✓'},

/* ===== SECTION C — EXTENDED RESPONSE ===== */
{id:'C18ai',section:'C',topic:'Energetics II',marks:1,
 q:'<b>Q18(a)(i)</b> Define the term <i>lattice enthalpy of dissociation</i>. [1]',
 a:'<b>Model answer:</b><br>The enthalpy change when ONE MOLE of an ionic compound is converted into its gaseous ions ✓ (always endothermic/positive).'},

{id:'C18aii',section:'C',topic:'Energetics II',marks:4,
 q:'<b>Q18(a)(ii)</b> Draw a fully labelled Born-Haber cycle for the formation of KCl(s) from its elements. [4]',
 a:'<b>Cycle steps:</b><br>K(s) → K(g) — atomisation of K ✓<br>K(g) → K⁺(g) + e⁻ — 1st IE of K ✓<br>½Cl₂(g) → Cl(g) — atomisation of chlorine ✓<br>Cl(g) + e⁻ → Cl⁻(g) — electron affinity of Cl ✓<br>K⁺(g) + Cl⁻(g) → KCl(s) — lattice enthalpy of formation (closes the cycle)<div class="tip">💡 Like NaCl, KCl is one of the SIMPLEST Born-Haber cycles — only one ionisation energy and one electron affinity step, no doubling required (Group 1 metal, single halide).</div>'},

{id:'C18aiii',section:'C',topic:'Energetics II',marks:3,
 q:'<b>Q18(a)(iii)</b> Calculate the lattice enthalpy of formation of KCl using: ΔH°f=−437, ΔH°at[K]=+89, IE1[K]=+419, ΔH°at[½Cl₂]=+121, EA1[Cl]=−349 (kJ/mol) [3]',

{id:'C18d',section:'C',topic:'Energetics II',marks:1,

/* ===== STATE ===== */
let currentSection='ALL';
let filtered=[];
let idx=0;
let flipped=false;
let progress=JSON.parse(localStorage.getItem('chemMock7Progress')||'{}');

const sections=[{k:'ALL',l:'All Cards'},{k:'A',l:'Section A · MCQ'},{k:'B',l:'Section B'},{k:'C',l:'Section C'}];

function buildTabs(){
  const wrap=document.getElementById('tabs');
  wrap.innerHTML='';
  sections.forEach(s=>{
    const btn=document.createElement('div');
    btn.className='tab'+(s.k===currentSection?' active':'');
    btn.textContent=s.l;
    btn.onclick=()=>{currentSection=s.k;idx=0;flipped=false;applyFilter();render();};
    wrap.appendChild(btn);
  });
}
function applyFilter(){
  filtered = currentSection==='ALL'? cards.slice() : cards.filter(c=>c.section===currentSection);
}
function flipCard(){flipped=!flipped;render();}
function nextCard(){if(idx<filtered.length-1){idx++;flipped=false;render();}}
function prevCard(){if(idx>0){idx--;flipped=false;render();}}
function shuffleDeck(){
  for(let i=filtered.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[filtered[i],filtered[j]]=[filtered[j],filtered[i]];}
  idx=0;flipped=false;render();
}
function mark(id,status){
  progress[id]=status;
  localStorage.setItem('chemMock7Progress',JSON.stringify(progress));
  render();
}
function resetProgress(){
  if(confirm('Reset all know/review progress?')){progress={};localStorage.setItem('chemMock7Progress','{}');render();}
}
function render(){
  buildTabs();
  const c=filtered[idx];
  const el=document.getElementById('cardEl');
  document.getElementById('counter').textContent = `Card ${idx+1} of ${filtered.length}`;
  document.getElementById('prevBtn').disabled = idx===0;
  document.getElementById('nextBtn').disabled = idx===filtered.length-1;
  const st=progress[c.id];
  el.className='card'+(flipped?' backface':'');
  el.innerHTML=`
    <div class="tagrow">
      <div><span class="qid">${c.id}</span><br><span class="topicchip">${c.topic}</span></div>
      ${c.marks?`<span class="marks">${c.marks} mark${c.marks>1?'s':''}</span>`:''}
    </div>
    <div class="content">${flipped? c.a : c.q}</div>
    <div class="fliphint">${flipped? '↺ tap to see question' : '👆 tap card to reveal answer'}</div>
    <div class="actions">
      <button class="btn review ${st==='review'?'sel':''}" onclick="event.stopPropagation();mark('${c.id}','review')">🔴 Review</button>
      <button class="btn know ${st==='know'?'sel':''}" onclick="event.stopPropagation();mark('${c.id}','know')">🟢 Know it</button>
    </div>`;
  const known=Object.values(progress).filter(v=>v==='know').length;
  const review=Object.values(progress).filter(v=>v==='review').length;
  document.getElementById('statTotal').textContent=cards.length;
  document.getElementById('statKnow').textContent=known;
  document.getElementById('statReview').textContent=review;
  document.getElementById('progressFill').style.width = (Object.keys(progress).length/cards.length*100)+'%';
}

applyFilter();
render();
</script>
