<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chemistry Mock Paper 9 — Flashcards</title>
<style>
  :root{
    --bg:#0a0e17; --bg2:#0f1524; --card:#141b2d; --card2:#182238;
    --accent:#2dd4bf; --accent2:#22b8a3; --amber:#fbbf24; --red:#f87171;
    --green:#4ade80; --text:#e5e9f0; --muted:#8b95a8; --border:#243044;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh;padding-bottom:40px;}
  header{padding:18px 16px 10px;text-align:center;position:sticky;top:0;background:rgba(10,14,23,0.96);
    backdrop-filter:blur(8px);z-index:20;border-bottom:1px solid var(--border);}
  h1{font-size:1.15rem;margin:0 0 2px;background:linear-gradient(90deg,var(--accent),#818cf8);
    -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;}
  .sub{font-size:0.72rem;color:var(--muted);margin-bottom:10px;}
  .progress-wrap{max-width:520px;margin:0 auto;}
  .progress-bar{height:6px;background:var(--border);border-radius:6px;overflow:hidden;margin-top:6px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#818cf8);width:0%;transition:width .3s;}
  .stats{display:flex;justify-content:center;gap:14px;margin-top:6px;font-size:0.68rem;color:var(--muted);}
  .stats span.k{color:var(--green);} .stats span.r{color:var(--red);}
  .tabs{display:flex;overflow-x:auto;gap:6px;padding:10px 12px 4px;max-width:560px;margin:0 auto;
    -ms-overflow-style:none;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;padding:7px 13px;border-radius:20px;background:var(--card);border:1px solid var(--border);
    color:var(--muted);font-size:0.72rem;font-weight:600;white-space:nowrap;cursor:pointer;}
  .tab.active{background:linear-gradient(90deg,var(--accent),#22b8a3);color:#04211c;border-color:transparent;}
  main{max-width:560px;margin:0 auto;padding:14px 14px 0;}
  .counter{text-align:center;font-size:0.75rem;color:var(--muted);margin-bottom:8px;}
  .deck{position:relative;height:420px;}
  .card{position:absolute;inset:0;background:var(--card);border:1px solid var(--border);border-radius:18px;
    padding:20px;display:flex;flex-direction:column;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,0.35);
    transition:transform .15s;overflow:hidden;}
  .card:active{transform:scale(0.985);}
  .tagrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .qid{font-size:0.68rem;font-weight:800;color:var(--accent);letter-spacing:.5px;}
  .marks{font-size:0.65rem;background:var(--card2);color:var(--amber);padding:3px 9px;border-radius:10px;
    font-weight:700;border:1px solid var(--border);}
  .topicchip{font-size:0.62rem;color:var(--muted);background:var(--bg2);padding:2px 8px;border-radius:8px;margin-top:2px;display:inline-block;}
  .content{flex:1;overflow-y:auto;font-size:0.92rem;line-height:1.55;padding-right:2px;}
  .content b{color:var(--accent);}
  .content .tip{margin-top:10px;padding:9px 10px;background:rgba(251,191,36,0.08);border-left:3px solid var(--amber);
    border-radius:6px;font-size:0.8rem;color:#fde68a;}
  .content .trap{margin-top:8px;padding:9px 10px;background:rgba(248,113,113,0.08);border-left:3px solid var(--red);
    border-radius:6px;font-size:0.8rem;color:#fecaca;}
  .content .eq{font-family:'Courier New',monospace;background:var(--bg2);padding:8px 10px;border-radius:8px;
    margin:6px 0;font-size:0.85rem;color:#93e8db;border:1px solid var(--border);}
  .fliphint{text-align:center;font-size:0.65rem;color:var(--muted);margin-top:8px;}
  .backface{background:var(--card2);}
  .actions{display:flex;gap:10px;margin-top:12px;}
  .btn{flex:1;padding:11px;border-radius:12px;border:none;font-weight:700;font-size:0.85rem;cursor:pointer;}
  .btn.review{background:rgba(248,113,113,0.15);color:var(--red);border:1px solid rgba(248,113,113,0.4);}
  .btn.know{background:rgba(74,222,128,0.15);color:var(--green);border:1px solid rgba(74,222,128,0.4);}
  .btn.review.sel{background:var(--red);color:#1a0505;}
  .btn.know.sel{background:var(--green);color:#052712;}
  .navrow{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;}
  .navbtn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 18px;
    border-radius:12px;font-size:0.85rem;font-weight:700;cursor:pointer;}
  .navbtn:disabled{opacity:0.3;}
  .resetrow{text-align:center;margin-top:18px;}
  .resetbtn{background:none;border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:10px;
    font-size:0.7rem;cursor:pointer;}
  table.mini{width:100%;border-collapse:collapse;margin:6px 0;font-size:0.78rem;}
  table.mini td,table.mini th{border:1px solid var(--border);padding:4px 6px;text-align:left;}
  table.mini th{background:var(--bg2);color:var(--accent);}
</style>
</head>
<body>
<header>
  <h1>🧪 Chemistry Mock Paper 9</h1>
  <div class="sub">Edexcel 9CH0/01 · Advanced Inorganic &amp; Physical Chemistry · 90 marks · for Jody</div>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="stats">
      <span>Total: <b id="statTotal">0</b></span>
      <span class="k">Know: <span id="statKnow">0</span></span>
      <span class="r">Review: <span id="statReview">0</span></span>
    </div>
  </div>
</header>

<div class="tabs" id="tabs"></div>

<main>
  <div class="counter" id="counter"></div>
  <div class="deck">
    <div class="card" id="cardEl" onclick="flipCard()"></div>
  </div>
  <div class="navrow">
    <button class="navbtn" id="prevBtn" onclick="prevCard()">← Prev</button>
    <button class="navbtn" id="shuffleBtn" onclick="shuffleDeck()">🔀 Shuffle</button>
    <button class="navbtn" id="nextBtn" onclick="nextCard()">Next →</button>
  </div>
  <div class="resetrow"><button class="resetbtn" onclick="resetProgress()">Reset all progress</button></div>
</main>

<script>
const cards = [
/* ===== SECTION A — MULTIPLE CHOICE (1 mark each) ===== */
{id:'A1',section:'A',topic:'Atomic Structure',marks:1,
 q:'<b>Q1.</b> Which ion has the electron configuration [Ar]3d⁵?<br><br>A. Cr³⁺&nbsp;&nbsp; B. Fe²⁺&nbsp;&nbsp; C. Mn²⁺&nbsp;&nbsp; D. Cu²⁺',
 a:'<b>Answer: C — Mn²⁺</b><br>Mn: [Ar]3d⁵4s² → Mn²⁺ = [Ar]3d⁵ (removes the 4s² electrons).<br>Cr³⁺=[Ar]3d³; Fe²⁺=[Ar]3d⁶; Cu²⁺=[Ar]3d⁹.'},

{id:'A2',section:'A',topic:'Periodicity',marks:1,
 q:'<b>Q2.</b> Which Period 3 element has the highest melting point?<br><br>A. Na&nbsp;&nbsp; B. Mg&nbsp;&nbsp; C. Al&nbsp;&nbsp; D. Si',
 a:'<b>Answer: D — Si</b><br>Giant covalent (macromolecular) structure — many strong covalent bonds must be broken throughout the whole lattice, giving by far the highest melting point in Period 3.'},

{id:'A3',section:'A',topic:'Redox I',marks:1,
 q:'<b>Q3.</b> What is the oxidation state of manganese in MnO₄⁻?<br><br>A. +4&nbsp;&nbsp; B. +5&nbsp;&nbsp; C. +6&nbsp;&nbsp; D. +7',
 a:'<div class="eq">4 × (−2) = −8; overall charge = −1<br>Mn = −1 − (−8) = <b>+7</b></div><b>Answer: D</b>'},

{id:'A4',section:'A',topic:'Equilibrium II',marks:1,
 q:'<b>Q4.</b> For 2SO₂(g)+O₂(g)⇌2SO₃(g), what is the effect of increasing total pressure on Kp?<br><br>A. Kp increases<br>B. Kp decreases<br>C. Kp stays the same<br>D. Kp becomes zero',
 a:'<b>Answer: C — Kp stays the same</b><br>Kp depends ONLY on temperature. Pressure changes shift the equilibrium position but never change the value of Kp itself.'},

{id:'A5',section:'A',topic:'Periodicity',marks:1,
 q:'<b>Q5.</b> Which oxide is basic?<br><br>A. Na₂O&nbsp;&nbsp; B. Al₂O₃&nbsp;&nbsp; C. SiO₂&nbsp;&nbsp; D. SO₂',
 a:'<b>Answer: A — Na₂O</b><br>A metal oxide that reacts with acids to form salts (basic). Al₂O₃ is amphoteric; SiO₂ and SO₂ are acidic.'},

{id:'A6',section:'A',topic:'Acid-Base',marks:1,
 q:'<b>Q6.</b> What is the pH of a 0.0010 mol dm⁻³ solution of Ba(OH)₂? (Kw = 1.0×10⁻¹⁴)<br><br>A. 11.0&nbsp;&nbsp; B. 11.3&nbsp;&nbsp; C. 11.6&nbsp;&nbsp; D. 12.0',
 a:'<div class="eq">[OH⁻] = 2 × 0.0010 = 0.0020 mol dm⁻³<br>pOH = −log(0.0020) = 2.70<br>pH = 14 − 2.70 = <b>11.30</b></div><b>Answer: B</b>'},

{id:'A7',section:'A',topic:'Transition Metals',marks:1,
 q:'<b>Q7.</b> Which complex ion is octahedral AND diamagnetic?<br><br>A. [Fe(H₂O)₆]²⁺&nbsp;&nbsp; B. [Co(NH₃)₆]³⁺&nbsp;&nbsp; C. [Cu(H₂O)₆]²⁺&nbsp;&nbsp; D. [NiCl₄]²⁻',
 a:'<b>Answer: B — [Co(NH₃)₆]³⁺</b><br>Co³⁺ is d⁶; with the strong-field NH₃ ligand it becomes low-spin, meaning all 6 electrons pair up completely → no unpaired electrons → diamagnetic. Fe²⁺ and Cu²⁺ both have unpaired electrons; [NiCl₄]²⁻ is tetrahedral, not octahedral.'},

{id:'A8',section:'A',topic:'Kinetics',marks:1,
 q:'<b>Q8.</b> Rate = k[A][B]. If [A] is halved and [B] is doubled, the rate:<br><br>A. doubles&nbsp;&nbsp; B. halves&nbsp;&nbsp; C. stays the same&nbsp;&nbsp; D. quadruples',
 a:'<div class="eq">New rate = k(½[A])(2[B]) = k[A][B] = original rate</div><b>Answer: C — stays the same</b> (the ½ and ×2 cancel out exactly)'},

{id:'A9',section:'A',topic:'Energetics',marks:1,
 q:'<b>Q9.</b> Which reaction has a POSITIVE standard entropy change, ΔS°?<br><br>A. H₂O(g)→H₂O(l)<br>B. CaCO₃(s)→CaO(s)+CO₂(g)<br>C. 2H₂(g)+O₂(g)→2H₂O(l)<br>D. N₂(g)+3H₂(g)→2NH₃(g)',
 a:'<b>Answer: B — CaCO₃(s)→CaO(s)+CO₂(g)</b><br>A solid decomposes to give a solid PLUS a gas — an increase in moles of gas (0→1) and a large increase in disorder. (A, C, D all involve a decrease in gas moles or gas condensing — all entropy DECREASES.)'},

{id:'A10',section:'A',topic:'Redox II',marks:1,
 q:'<b>Q10.</b> E°(Zn²⁺/Zn)=−0.76V, E°(Cu²⁺/Cu)=+0.34V. What is E°cell for zinc and copper(II) ions?<br><br>A. −1.10 V&nbsp;&nbsp; B. +0.42 V&nbsp;&nbsp; C. +1.10 V&nbsp;&nbsp; D. +1.44 V',
 a:'<div class="eq">E°cell = 0.34 − (−0.76) = <b>+1.10 V</b></div><b>Answer: C</b>'},

/* ===== SECTION B ===== */
{id:'B11a',section:'B',topic:'Atomic Structure',marks:2,
 q:'<b>Q11(a)</b> Successive IEs of X (kJ/mol): 590, 1145, 4912, 6491. Identify the group X belongs to and explain your answer. [2]',
 a:'<b>Group 2 / alkaline earth metals</b> ✓<br>There is a large jump between the 2nd and 3rd ionisation energies ✓ — the first 2 electrons are removed relatively easily from the outer shell, but the 3rd comes from a much more stable inner shell, requiring far more energy. This confirms X has 2 outer-shell electrons.'},

{id:'B11b',section:'B',topic:'Atomic Structure',marks:1,
 q:'<b>Q11(b)</b> Write an equation, including state symbols, for the second ionisation energy of X. [1]',
 a:'<div class="eq">X⁺(g) → X²⁺(g) + e⁻</div>✓'},

{id:'B12a',section:'B',topic:'Bonding',marks:2,
 q:'<b>Q12(a)</b> Draw a dot-and-cross diagram for NH₃, outer electrons only. [2]',
 a:'<b>Model answer:</b><br>Three N–H bonds, each shown as a shared pair (2 electrons) ✓<br>One lone pair shown on nitrogen ✓'},

{id:'B12b',section:'B',topic:'Bonding',marks:3,
 q:'<b>Q12(b)</b> State the shape of NH₃ and its bond angle. Explain using electron pair repulsion. [max 3]',
 a:'<b>Shape: trigonal pyramidal</b> ✓ &nbsp; <b>Bond angle: 107°</b> ✓<br>Three bonding pairs + one lone pair around N; lone pair–bonding pair repulsion is greater than bonding pair–bonding pair repulsion, squeezing the angle below 109.5° ✓'},

{id:'B12c',section:'B',topic:'Acid-Base',marks:2,
 q:'<b>Q12(c)</b> Explain why ammonia is a weak base. Include an equation. [max 2]',
 a:'<b>Model answer:</b><br>Ammonia accepts a proton (H⁺) from water ✓<div class="eq">NH₃ + H₂O ⇌ NH₄⁺ + OH⁻</div>The equilibrium lies well to the LEFT — ammonia is only partially ionised/protonated in water ✓ (unlike a strong base, which would fully accept protons)'},

{id:'B13a',section:'B',topic:'Halogens',marks:2,
 q:'<b>Q13(a)</b> Ionic equation for aqueous chlorine + aqueous sodium iodide. State the observation. [2]',
 a:'<div class="eq">Cl₂(aq) + 2I⁻(aq) → 2Cl⁻(aq) + I₂(aq)</div>✓<br>Observation: colourless → brown/orange/yellow ✓'},

{id:'B13b',section:'B',topic:'Halogens',marks:3,
 q:'<b>Q13(b)</b> Conc. H₂SO₄ + solid NaBr forms SO₂. Write a balanced equation and explain why Br⁻ is a stronger reducing agent than Cl⁻. [3]',
 a:'<div class="eq">2NaBr + 3H₂SO₄ → 2NaHSO₄ + Br₂ + SO₂ + 2H₂O</div>✓ (or ionic equivalent)<br>Br⁻ is a stronger reducing agent than Cl⁻ ✓<br>E°(Br₂/Br⁻) is less positive than E°(Cl₂/Cl⁻), so Br⁻ more readily loses electrons / reduces H₂SO₄ (whereas Cl⁻ cannot) ✓'},

{id:'B13c',section:'B',topic:'Halogens',marks:1,
 q:'<b>Q13(c)</b> Explain why hydrogen fluoride has a higher boiling point than hydrogen chloride. [1]',
 a:'<b>Model answer:</b><br>HF has hydrogen bonding between molecules ✓ (F is small, highly electronegative, with lone pairs) — HCl only has weaker dipole-dipole and London forces.'},

{id:'B14a',section:'B',topic:'Thermodynamics',marks:2,
 q:'<b>Q14(a)</b> CaCO₃(s)→CaO(s)+CO₂(g), ΔH°=+178 kJ/mol, ΔS°=+161 J K⁻¹mol⁻¹. Calculate ΔG° at 298 K and state whether the reaction is feasible. [2]',
 a:'<div class="eq">ΔG° = ΔH° − TΔS° = 178 − (298 × 0.161) ✓<br>ΔG° = 178 − 47.98 = <b>+130 kJ mol⁻¹</b> ✓</div><b>NOT feasible</b> (since ΔG° > 0)<div class="trap">⚠️ Trap: ΔS° is given in J K⁻¹mol⁻¹ but ΔH° is in kJ/mol — always convert ΔS° to kJ (÷1000) BEFORE substituting, or convert ΔH° to J instead. Mixing units here is one of the most common lost marks in the whole specification.</div>'},

{id:'B14b',section:'B',topic:'Thermodynamics',marks:2,
 q:'<b>Q14(b)</b> Calculate the minimum temperature at which this reaction becomes feasible. [2]',
 a:'<div class="eq">Feasible when ΔG°=0: T = ΔH° / ΔS° = 178,000 / 161 ✓<br>T > <b>1106 K</b></div>✓ (accept 1105–1107)<div class="tip">💡 Always convert BOTH values to the same energy unit (both J or both kJ) before dividing — here using ΔH° in J (178,000) and ΔS° in J K⁻¹mol⁻¹ (161) gives T directly in Kelvin.</div>'},

{id:'B15a',section:'B',topic:'Stoichiometry',marks:1,
 q:'<b>Q15(a)</b> Write the equation, with state symbols, for CaCO₃ + excess HCl. [1]',
 a:'<div class="eq">CaCO₃(s) + 2HCl(aq) → CaCl₂(aq) + H₂O(l) + CO₂(g)</div>✓'},

{id:'B15b',section:'B',topic:'Stoichiometry',marks:1,
 q:'<b>Q15(b)</b> 0.480 dm³ of CO₂ was collected at r.t.p (Vm=24.0 dm³/mol). Calculate the moles of CO₂. [1]',
 a:'<div class="eq">n(CO₂) = 0.480 / 24.0 = <b>0.0200 mol</b></div>✓'},

{id:'B15c',section:'B',topic:'Stoichiometry',marks:2,
 q:'<b>Q15(c)</b> 2.50 g of impure CaCO₃ produced this CO₂. Calculate the % purity. [2]',
 a:'<div class="eq">n(CaCO₃) = 0.0200 mol (1:1 ratio); mass = 0.0200 × 100.1 = 2.002 g ✓<br>% purity = (2.002 / 2.50) × 100 = <b>80.1%</b> ✓</div>'},

{id:'B15d',section:'B',topic:'Stoichiometry',marks:1,
 q:'<b>Q15(d)</b> State one assumption you made in your calculation in part (c). [1]',
 a:'<b>Any one:</b> all the CO₂ was collected/no gas lost ✓ — OR the impurity does not react to produce CO₂ ✓ — OR the molar volume was exactly 24.0 dm³ mol⁻¹ at the conditions used ✓'},

{id:'B16a',section:'B',topic:'Kinetics',marks:2,
 q:'<b>Q16(a)</b> Rate data:<table class="mini"><tr><th>Exp</th><th>[A]</th><th>[B]</th><th>Rate</th></tr><tr><td>1</td><td>0.10</td><td>0.10</td><td>2.0×10⁻³</td></tr><tr><td>2</td><td>0.20</td><td>0.10</td><td>8.0×10⁻³</td></tr><tr><td>3</td><td>0.10</td><td>0.20</td><td>2.0×10⁻³</td></tr></table>Deduce the order wrt A and wrt B. [2]',
 a:'<b>Order wrt A: 2</b> ✓ (doubling [A], rate ×4)<br><b>Order wrt B: 0</b> ✓ (doubling [B], rate unchanged)'},

{id:'B16b',section:'B',topic:'Kinetics',marks:2,
 q:'<b>Q16(b)</b> Write the rate equation and calculate k, with units. [2]',
 a:'<div class="eq">Rate = k[A]²<br>k = 2.0×10⁻³ / (0.10)² = <b>0.20</b><br>Units: mol⁻¹ dm³ s⁻¹</div>✓✓'},

{id:'B16c',section:'B',topic:'Kinetics',marks:2,
 q:'<b>Q16(c)</b> Which mechanism is consistent with your rate equation?<br>Mechanism 1: A+B→C (slow), then C+A→D (fast)<br>Mechanism 2: 2A→C (slow), then C+B→D (fast) [2]',
 a:'<b>Answer: Mechanism 2</b> ✓<br>The slow step involves TWO molecules of A colliding — this matches the deduced rate equation (second order in A, zero order in B, since B only appears in the fast step AFTER the rate-determining step) ✓<div class="tip">💡 Compare with Mechanism 1: its slow step (A+B) would predict rate=k[A][B], i.e. FIRST order in both A and B — clearly inconsistent with the zero order found for B here.</div>'},

{id:'B16d',section:'B',topic:'Kinetics',marks:1,
 q:'<b>Q16(d)</b> Sketch a graph showing how [A] changes with time. [1]',
 a:'<b>Model answer:</b><br>Exponential-style decay curve starting at the initial concentration, approaching zero asymptotically ✓ (2nd-order decay shape — falls steeply at first, then gradually levels off)'},

{id:'B17a',section:'B',topic:'Equilibrium I',marks:3,
 q:'<b>Q17(a)</b> H₂(g)+I₂(g)⇌2HI(g). 0.20 mol H₂ + 0.20 mol I₂ in a 1.0 dm³ container reach equilibrium at 700K; 0.32 mol HI present at equilibrium. Calculate Kc. [3]',
 a:'<table class="mini"><tr><th></th><th>H₂</th><th>I₂</th><th>HI</th></tr><tr><td>Initial</td><td>0.20</td><td>0.20</td><td>0</td></tr><tr><td>Change</td><td>−0.16</td><td>−0.16</td><td>+0.32</td></tr><tr><td>Eqm</td><td>0.04</td><td>0.04</td><td>0.32</td></tr></table>✓✓ (ICE table)<div class="eq">Kc = (0.32)² / (0.04 × 0.04) = 0.1024 / 0.0016 = <b>64</b> (no units)</div>✓'},

{id:'B17b',section:'B',topic:'Acid-Base',marks:2,
 q:'<b>Q17(b)</b> Calculate the pH of 0.10 mol dm⁻³ benzoic acid, C₆H₅COOH. (Ka = 6.3×10⁻⁵) [2]',
 a:'<div class="eq">[H⁺] = √(Ka × [HA]) = √(6.3×10⁻⁵ × 0.10) = √(6.3×10⁻⁶) ✓<br>[H⁺] = 2.51×10⁻³ mol dm⁻³<br>pH = <b>2.60</b></div>✓'},

{id:'B17c',section:'B',topic:'Acid-Base',marks:3,
 q:'<b>Q17(c)</b> A buffer is made by mixing 50.0 cm³ of 0.20 mol dm⁻³ benzoic acid with 50.0 cm³ of 0.10 mol dm⁻³ NaOH. Calculate the pH. [3]',
 a:'<div class="eq">Moles C₆H₅COOH initially = 0.050 × 0.20 = 0.010 mol<br>Moles NaOH = 0.050 × 0.10 = 0.0050 mol ✓<br>After reaction: acid remaining = 0.0050 mol; salt formed = 0.0050 mol (equal!) ✓<br>pH = pKa + log(1) = −log(6.3×10⁻⁵) = <b>4.20</b> ✓</div><div class="tip">💡 Same "exactly half neutralised" shortcut as before — spot when [salt]=[acid] and skip straight to pH=pKa.</div>'},

{id:'B17d',section:'B',topic:'Acid-Base',marks:1,
 q:'<b>Q17(d)</b> Explain, with an equation, how this buffer resists a pH change when a small amount of alkali is added. [1]',
 a:'<div class="eq">C₆H₅COOH + OH⁻ → C₆H₅COO⁻ + H₂O</div>✓ Added OH⁻ is neutralised by the weak acid component; the ratio [salt]/[acid] changes only slightly, so pH remains approximately constant.'},

/* ===== SECTION C — EXTENDED RESPONSE ===== */
{id:'C18ai',section:'C',topic:'Energetics II',marks:1,
 q:'<b>Q18(a)(i)</b> Define the term <i>lattice enthalpy of dissociation</i>. [1]',
 a:'<b>Model answer:</b><br>The enthalpy change when ONE MOLE of an ionic compound is converted into its gaseous ions ✓ (always endothermic/positive).'},

{id:'C18aii',section:'C',topic:'Energetics II',marks:4,
 q:'<b>Q18(a)(ii)</b> Draw a fully labelled Born-Haber cycle for the formation of K₂O(s) from its elements. [4]',
 a:'<b>Cycle steps:</b><br>2K(s) → 2K(g) — atomisation of K (×2) ✓<br>2K(g) → 2K⁺(g) + 2e⁻ — 1st IE of K (×2) ✓<br>½O₂(g) → O(g) — atomisation of oxygen ✓<br>O(g) + 2e⁻ → O²⁻(g) — 1st + 2nd electron affinity of O ✓<br>2K⁺(g) + O²⁻(g) → K₂O(s) — lattice enthalpy of formation (closes the cycle)<div class="trap">⚠️ Trap: because there are 2 potassium atoms in K₂O, BOTH the atomisation and the ionisation energy steps for K must be doubled (×2).</div>'},

{id:'C18aiii',section:'C',topic:'Energetics II',marks:4,
 q:'<b>Q18(a)(iii)</b> Calculate the lattice enthalpy of formation of K₂O using: ΔH°f=−363, ΔH°at[K]=+89, IE1[K]=+419, ΔH°at[½O₂]=+249, EA1[O]=−141, EA2[O]=+798 (kJ/mol) [4]',
 a:'<div class="eq">−363 = 2(89) + 2(419) + (249) + (−141) + (798) + ΔH°LE ✓✓<br>−363 = 178 + 838 + 249 − 141 + 798 + ΔH°LE<br>−363 = 1922 + ΔH°LE<br>ΔH°LE = <b>−2285 kJ mol⁻¹</b> ✓✓</div>'},

{id:'C18bi',section:'C',topic:'Energetics II',marks:2,

{id:'C18bii',section:'C',topic:'Energetics II',marks:2,

{id:'TIPS',section:'C',topic:'Exam Technique',marks:0,

 a:'<b>1.</b> Gibbs free energy and feasibility — ΔG° = ΔH° − TΔS°. Remember to convert ΔS° from J to kJ (÷1000) before combining with ΔH° in kJ. A reaction becomes feasible when ΔG°=0, giving T = ΔH°/ΔS°.<br><b>2.</b> Born-Haber for Group 1 oxides — multiply atomisation AND ionisation energy by 2 (for 2K⁺ in K₂O). The second electron affinity of oxygen is always endothermic (+798 kJ mol⁻¹).<br><b>3.</b> Rate-determining step — the slow step must match the rate equation. If rate=k[A]², the slow step must involve TWO A molecules colliding (or an intermediate formed from 2A).<br><b>4.</b> Buffer from partial neutralisation — when exactly half the weak acid is neutralised, [acid]=[salt] and pH=pKa directly. A great shortcut for checking your answer.<br><b>5.</b> Dichromate titrations — the mole ratio of Cr₂O₇²⁻:Fe²⁺ is 1:6. The colour change is orange to green (not purple to colourless like manganate).<br><b>6.</b> Kp units — always derive them from the expression. For N₂O₄⇌2NO₂, Kp has simple units of pressure (kPa or atm), unlike the Haber process\'s atm⁻².<div class="tip">💡 Highest-mark topics on this paper: Redox II (17), Equilibrium & Acid-Base (14), Transition Metals (14), Energetics II (13) — prioritise these in revision time.</div>'},

/* ===== STATE ===== */
let currentSection='ALL';
let filtered=[];
let idx=0;
let flipped=false;
let progress=JSON.parse(localStorage.getItem('chemMock9Progress')||'{}');

const sections=[{k:'ALL',l:'All Cards'},{k:'A',l:'Section A · MCQ'},{k:'B',l:'Section B'},{k:'C',l:'Section C'}];

function buildTabs(){
  const wrap=document.getElementById('tabs');
  wrap.innerHTML='';
  sections.forEach(s=>{
    const btn=document.createElement('div');
    btn.className='tab'+(s.k===currentSection?' active':'');
    btn.textContent=s.l;
    btn.onclick=()=>{currentSection=s.k;idx=0;flipped=false;applyFilter();render();};
    wrap.appendChild(btn);
  });
}
function applyFilter(){
  filtered = currentSection==='ALL'? cards.slice() : cards.filter(c=>c.section===currentSection);
}
function flipCard(){flipped=!flipped;render();}
function nextCard(){if(idx<filtered.length-1){idx++;flipped=false;render();}}
function prevCard(){if(idx>0){idx--;flipped=false;render();}}
function shuffleDeck(){
  for(let i=filtered.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[filtered[i],filtered[j]]=[filtered[j],filtered[i]];}
  idx=0;flipped=false;render();
}
function mark(id,status){
  progress[id]=status;
  localStorage.setItem('chemMock9Progress',JSON.stringify(progress));
  render();
}
function resetProgress(){
  if(confirm('Reset all know/review progress?')){progress={};localStorage.setItem('chemMock9Progress','{}');render();}
}
function render(){
  buildTabs();
  const c=filtered[idx];
  const el=document.getElementById('cardEl');
  document.getElementById('counter').textContent = `Card ${idx+1} of ${filtered.length}`;
  document.getElementById('prevBtn').disabled = idx===0;
  document.getElementById('nextBtn').disabled = idx===filtered.length-1;
  const st=progress[c.id];
  el.className='card'+(flipped?' backface':'');
  el.innerHTML=`
    <div class="tagrow">
      <div><span class="qid">${c.id}</span><br><span class="topicchip">${c.topic}</span></div>
      ${c.marks?`<span class="marks">${c.marks} mark${c.marks>1?'s':''}</span>`:''}
    </div>
    <div class="content">${flipped? c.a : c.q}</div>
    <div class="fliphint">${flipped? '↺ tap to see question' : '👆 tap card to reveal answer'}</div>
    <div class="actions">
      <button class="btn review ${st==='review'?'sel':''}" onclick="event.stopPropagation();mark('${c.id}','review')">🔴 Review</button>
      <button class="btn know ${st==='know'?'sel':''}" onclick="event.stopPropagation();mark('${c.id}','know')">🟢 Know it</button>
    </div>`;
  const known=Object.values(progress).filter(v=>v==='know').length;
  const review=Object.values(progress).filter(v=>v==='review').length;
  document.getElementById('statTotal').textContent=cards.length;
  document.getElementById('statKnow').textContent=known;
  document.getElementById('statReview').textContent=review;
  document.getElementById('progressFill').style.width = (Object.keys(progress).length/cards.length*100)+'%';
}

applyFilter();
render();
</script>
