<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chemistry Mock Paper 2 — Flashcards</title>
<style>
  :root{
    --bg:#0a0e17; --bg2:#0f1524; --card:#141b2d; --card2:#182238;
    --accent:#2dd4bf; --accent2:#22b8a3; --amber:#fbbf24; --red:#f87171;
    --green:#4ade80; --text:#e5e9f0; --muted:#8b95a8; --border:#243044;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh;padding-bottom:40px;}
  header{padding:18px 16px 10px;text-align:center;position:sticky;top:0;background:rgba(10,14,23,0.96);
    backdrop-filter:blur(8px);z-index:20;border-bottom:1px solid var(--border);}
  h1{font-size:1.15rem;margin:0 0 2px;background:linear-gradient(90deg,var(--accent),#818cf8);
    -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;}
  .sub{font-size:0.72rem;color:var(--muted);margin-bottom:10px;}
  .progress-wrap{max-width:520px;margin:0 auto;}
  .progress-bar{height:6px;background:var(--border);border-radius:6px;overflow:hidden;margin-top:6px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#818cf8);width:0%;transition:width .3s;}
  .stats{display:flex;justify-content:center;gap:14px;margin-top:6px;font-size:0.68rem;color:var(--muted);}
  .stats span.k{color:var(--green);} .stats span.r{color:var(--red);}
  .tabs{display:flex;overflow-x:auto;gap:6px;padding:10px 12px 4px;max-width:560px;margin:0 auto;
    -ms-overflow-style:none;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;padding:7px 13px;border-radius:20px;background:var(--card);border:1px solid var(--border);
    color:var(--muted);font-size:0.72rem;font-weight:600;white-space:nowrap;cursor:pointer;}
  .tab.active{background:linear-gradient(90deg,var(--accent),#22b8a3);color:#04211c;border-color:transparent;}
  main{max-width:560px;margin:0 auto;padding:14px 14px 0;}
  .counter{text-align:center;font-size:0.75rem;color:var(--muted);margin-bottom:8px;}
  .deck{position:relative;height:420px;}
  .card{position:absolute;inset:0;background:var(--card);border:1px solid var(--border);border-radius:18px;
    padding:20px;display:flex;flex-direction:column;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,0.35);
    transition:transform .15s;overflow:hidden;}
  .card:active{transform:scale(0.985);}
  .tagrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .qid{font-size:0.68rem;font-weight:800;color:var(--accent);letter-spacing:.5px;}
  .marks{font-size:0.65rem;background:var(--card2);color:var(--amber);padding:3px 9px;border-radius:10px;
    font-weight:700;border:1px solid var(--border);}
  .topicchip{font-size:0.62rem;color:var(--muted);background:var(--bg2);padding:2px 8px;border-radius:8px;margin-top:2px;display:inline-block;}
  .content{flex:1;overflow-y:auto;font-size:0.92rem;line-height:1.55;padding-right:2px;}
  .content b{color:var(--accent);}
  .content .tip{margin-top:10px;padding:9px 10px;background:rgba(251,191,36,0.08);border-left:3px solid var(--amber);
    border-radius:6px;font-size:0.8rem;color:#fde68a;}
  .content .trap{margin-top:8px;padding:9px 10px;background:rgba(248,113,113,0.08);border-left:3px solid var(--red);
    border-radius:6px;font-size:0.8rem;color:#fecaca;}
  .content .eq{font-family:'Courier New',monospace;background:var(--bg2);padding:8px 10px;border-radius:8px;
    margin:6px 0;font-size:0.85rem;color:#93e8db;border:1px solid var(--border);}
  .fliphint{text-align:center;font-size:0.65rem;color:var(--muted);margin-top:8px;}
  .backface{background:var(--card2);}
  .actions{display:flex;gap:10px;margin-top:12px;}
  .btn{flex:1;padding:11px;border-radius:12px;border:none;font-weight:700;font-size:0.85rem;cursor:pointer;}
  .btn.review{background:rgba(248,113,113,0.15);color:var(--red);border:1px solid rgba(248,113,113,0.4);}
  .btn.know{background:rgba(74,222,128,0.15);color:var(--green);border:1px solid rgba(74,222,128,0.4);}
  .btn.review.sel{background:var(--red);color:#1a0505;}
  .btn.know.sel{background:var(--green);color:#052712;}
  .navrow{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;}
  .navbtn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 18px;
    border-radius:12px;font-size:0.85rem;font-weight:700;cursor:pointer;}
  .navbtn:disabled{opacity:0.3;}
  .resetrow{text-align:center;margin-top:18px;}
  .resetbtn{background:none;border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:10px;
    font-size:0.7rem;cursor:pointer;}
  table.mini{width:100%;border-collapse:collapse;margin:6px 0;font-size:0.78rem;}
  table.mini td,table.mini th{border:1px solid var(--border);padding:4px 6px;text-align:left;}
  table.mini th{background:var(--bg2);color:var(--accent);}
</style>
</head>
<body>
<header>
  <h1>🧪 Chemistry Mock Paper 2</h1>
  <div class="sub">Edexcel 9CH0/01 · Advanced Inorganic &amp; Physical Chemistry · 90 marks · for Jody</div>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="stats">
      <span>Total: <b id="statTotal">0</b></span>
      <span class="k">Know: <span id="statKnow">0</span></span>
      <span class="r">Review: <span id="statReview">0</span></span>
    </div>
  </div>
</header>

<div class="tabs" id="tabs"></div>

<main>
  <div class="counter" id="counter"></div>
  <div class="deck">
    <div class="card" id="cardEl" onclick="flipCard()"></div>
  </div>
  <div class="navrow">
    <button class="navbtn" id="prevBtn" onclick="prevCard()">← Prev</button>
    <button class="navbtn" id="shuffleBtn" onclick="shuffleDeck()">🔀 Shuffle</button>
    <button class="navbtn" id="nextBtn" onclick="nextCard()">Next →</button>
  </div>
  <div class="resetrow"><button class="resetbtn" onclick="resetProgress()">Reset all progress</button></div>
</main>

<script>
const cards = [
/* ===== SECTION A — MULTIPLE CHOICE (1 mark each) ===== */
{id:'A1',section:'A',topic:'Atomic Structure',marks:1,
 q:'<b>Q1.</b> Which ion has exactly one unpaired electron?<br><br>A. Ti³⁺&nbsp;&nbsp; B. V²⁺&nbsp;&nbsp; C. Fe²⁺&nbsp;&nbsp; D. Cu⁺',
 a:'<b>Answer: A — Ti³⁺</b><br>Ti: [Ar]3d²4s² → Ti³⁺ = [Ar]3d¹ → 1 unpaired electron.<br>Check others: V²⁺ = [Ar]3d³ (3 unpaired); Fe²⁺ = [Ar]3d⁶ (4 unpaired, high spin); Cu⁺ = [Ar]3d¹⁰ (0 unpaired — diamagnetic).<div class="tip">💡 Always remove 4s electrons FIRST when forming any transition metal ion, then work out the d-count.</div>'},

{id:'A2',section:'A',topic:'Bonding',marks:1,
 q:'<b>Q2.</b> Which substance has the most exothermic lattice enthalpy?<br><br>A. NaF&nbsp;&nbsp; B. NaCl&nbsp;&nbsp; C. MgF₂&nbsp;&nbsp; D. MgCl₂',
 a:'<b>Answer: C — MgF₂</b><br>Mg²⁺ has double the charge of Na⁺, and F⁻ is smaller than Cl⁻ — higher charge AND smaller radius both increase lattice enthalpy magnitude, so MgF₂ combines both effects most strongly.'},

{id:'A3',section:'A',topic:'Redox I',marks:1,
 q:'<b>Q3.</b> In the reaction between acidified manganate(VII) and ethanedioate ions, C₂O₄²⁻, what is the change in oxidation number of manganese?<br><br>A. +2 to +7&nbsp;&nbsp; B. +7 to +2&nbsp;&nbsp; C. +4 to +2&nbsp;&nbsp; D. +7 to +4',
 a:'<b>Answer: B — +7 to +2</b><br>MnO₄⁻ has Mn at +7 (4×O=−8, overall −1, so Mn=+7). It is reduced to Mn²⁺ (+2) — a change of 5 in oxidation number, matching the 5-electron transfer per Mn in this classic titration reaction.'},

{id:'A4',section:'A',topic:'Equilibrium II',marks:1,
 q:'<b>Q4.</b> For 2SO₂(g) + O₂(g) ⇌ 2SO₃(g), what are the units of Kp?<br><br>A. atm&nbsp;&nbsp; B. atm⁻¹&nbsp;&nbsp; C. atm⁻²&nbsp;&nbsp; D. No units',
 a:'<b>Answer: B — atm⁻¹</b><div class="eq">Kp = p(SO₃)² / [p(SO₂)² × p(O₂)]<br>units = atm² / (atm² × atm) = atm⁻¹</div><div class="tip">💡 Always derive Kp units from the expression itself — never guess. Count moles of gas each side: 3 on the left, 2 on the right, so units will NOT cancel to nothing.</div>'},

{id:'A5',section:'A',topic:'Periodic Table',marks:1,
 q:'<b>Q5.</b> Which Period 3 element forms an amphoteric oxide?<br><br>A. Na&nbsp;&nbsp; B. Mg&nbsp;&nbsp; C. Al&nbsp;&nbsp; D. Si',
 a:'<b>Answer: C — Al</b><br>Al₂O₃ is amphoteric — it reacts with BOTH acids and bases. (Na₂O and MgO are basic; SiO₂ is acidic.)'},

{id:'A6',section:'A',topic:'Acid-Base',marks:1,
 q:'<b>Q6.</b> What is the pH of a 0.050 mol dm⁻³ solution of Ba(OH)₂? (Kw = 1.0×10⁻¹⁴ mol² dm⁻⁶)<br><br>A. 12.0&nbsp;&nbsp; B. 12.3&nbsp;&nbsp; C. 13.0&nbsp;&nbsp; D. 13.3',
 a:'<div class="eq">[OH⁻] = 2 × 0.050 = 0.10 mol dm⁻³<br>pOH = −log(0.10) = 1.0<br>pH = 14 − 1.0 = <b>13.0</b></div><b>Answer: C</b><div class="trap">⚠️ Trap: Ba(OH)₂ releases TWO OH⁻ per formula unit — always double the concentration for group 2 hydroxides before taking logs.</div>'},

{id:'A7',section:'A',topic:'Transition Metals',marks:1,
 q:'<b>Q7.</b> Which complex ion is octahedral AND paramagnetic?<br><br>A. [Zn(H₂O)₆]²⁺&nbsp;&nbsp; B. [Cu(H₂O)₆]²⁺&nbsp;&nbsp; C. [Ag(NH₃)₂]⁺&nbsp;&nbsp; D. [Ni(CN)₄]²⁻',
 a:'<b>Answer: B — [Cu(H₂O)₆]²⁺</b><br>Cu²⁺ is d⁹ (octahedral, 6 ligands) with an unpaired electron → paramagnetic.<br>Zn²⁺ is d¹⁰ (full shell, diamagnetic); Ag⁺ complex is linear (2 ligands); [Ni(CN)₄]²⁻ is square planar and low-spin diamagnetic (d⁸ with strong-field CN⁻ ligand).'},

{id:'A8',section:'A',topic:'Kinetics',marks:1,
 q:'<b>Q8.</b> Rate = k[A]²[B]. If [A] is doubled and [B] is halved, what happens to the rate?<br><br>A. Doubles&nbsp;&nbsp; B. Halves&nbsp;&nbsp; C. Stays the same&nbsp;&nbsp; D. Quadruples',
 a:'<div class="eq">New rate = k(2[A])² × (0.5[B]) = k × 4[A]² × 0.5[B] = 2 × (original rate)</div><b>Answer: A — Doubles</b><div class="tip">💡 Substitute the multiplier INTO the rate law and simplify algebraically — don\'t try to guess the combined effect.</div>'},

{id:'A9',section:'A',topic:'Redox II',marks:1,
 q:'<b>Q9.</b> In an electrochemical cell, which statement is correct?<br><br>A. Oxidation occurs at the cathode<br>B. Electrons flow from the positive electrode to the negative electrode<br>C. The salt bridge allows ions to move between half-cells<br>D. E°cell must be negative for a spontaneous reaction',
 a:'<b>Answer: C</b><br>A: oxidation actually occurs at the ANODE. B: electrons flow from negative → positive (through the external circuit). D: E°cell must be POSITIVE for a spontaneous reaction.'},

{id:'A10',section:'A',topic:'Equilibrium I',marks:1,
 q:'<b>Q10.</b> Which statement about catalysts is true?<br><br>A. They increase the equilibrium yield of products<br>B. They provide an alternative reaction pathway with lower activation energy<br>C. They increase the value of the equilibrium constant<br>D. They are consumed in the reaction',
 a:'<b>Answer: B</b><br>Catalysts lower Ea by providing an alternative pathway — they speed up BOTH forward and reverse reactions equally, so they never shift equilibrium position, never change K, and are regenerated (not consumed) at the end.'},

/* ===== SECTION B ===== */
{id:'B11a',section:'B',topic:'Atomic Structure',marks:1,
 q:'<b>Q11(a)</b> Write the full electron configuration of a vanadium atom (Z=23). [1]',
 a:'<div class="eq">1s² 2s² 2p⁶ 3s² 3p⁶ 3d³ 4s²</div>✓'},

{id:'B11b',section:'B',topic:'Atomic Structure',marks:1,
 q:'<b>Q11(b)</b> Write the electron configuration of the V³⁺ ion. [1]',
 a:'<div class="eq">1s² 2s² 2p⁶ 3s² 3p⁶ 3d²</div>✓<div class="tip">💡 Remove both 4s electrons first (V³⁺ loses 3 electrons total: 2 from 4s, 1 from 3d).</div>'},

{id:'B11c',section:'B',topic:'Atomic Structure',marks:3,
 q:'<b>Q11(c)</b> Explain why the first ionisation energy of sulfur is lower than that of phosphorus. [3]',
 a:'<b>Model answer:</b><br>P: [Ne]3s²3p³, S: [Ne]3s²3p⁴ ✓<br>In P, the 3p sub-shell is exactly half-filled, which is a relatively stable/extra-stable arrangement ✓<br>In S, one 3p orbital contains a PAIRED electron which experiences extra repulsion, so less energy is needed to remove it ✓<div class="tip">💡 This is the Group 15/16 dip pattern — same logic as N vs O in Period 2. Always mention "half-filled stability" AND "electron-pair repulsion."</div>'},

{id:'B12a',section:'B',topic:'Bonding',marks:2,
 q:'<b>Q12(a)</b> Draw a dot-and-cross diagram for CO₂, outer electrons only. [2]',
 a:'<b>Model answer:</b><br>Two C=O double bonds, each shown as 4 shared electrons (2 dots + 2 crosses) ✓<br>Two lone pairs shown on EACH oxygen atom ✓'},

{id:'B12b',section:'B',topic:'Bonding',marks:3,
 q:'<b>Q12(b)</b> State the shape of CO₂ and its bond angle. Explain using electron pair repulsion. [max 3]',
 a:'<b>Model answer:</b><br>Shape: <b>linear</b> ✓ &nbsp; Bond angle: <b>180°</b> ✓<br>Two bonding pairs around C, no lone pairs — they repel equally and get as far apart as possible ✓'},

{id:'B12c',section:'B',topic:'Bonding',marks:3,
 q:'<b>Q12(c)</b> CO₂ is a gas at room temperature; SiO₂ is a solid with a very high melting point. Explain, in terms of structure and bonding. [max 3]',
 a:'<b>Model answer:</b><br>CO₂: simple molecular / discrete molecules ✓, held together only by weak London (dispersion) intermolecular forces, which need little energy to overcome ✓<br>SiO₂: giant covalent / macromolecular structure ✓ — strong covalent bonds must be broken throughout the whole lattice to melt it, needing far more energy ✓<div class="trap">⚠️ Trap: never say "CO₂ has weak covalent bonds" — the C=O covalent bonds are strong; it\'s the intermolecular forces BETWEEN molecules that are weak.</div>'},

{id:'B13a',section:'B',topic:'Halogens',marks:3,
 q:'<b>Q13(a)</b> Ionic equation for aqueous chlorine + aqueous sodium iodide. State the observation. [3]',
 a:'<div class="eq">Cl₂(aq) + 2I⁻(aq) → 2Cl⁻(aq) + I₂(aq)</div>✓✓<br>Observation: colourless → brown / orange / yellow ✓'},

{id:'B13b',section:'B',topic:'Halogens',marks:3,
 q:'<b>Q13(b)</b> Conc. H₂SO₄ + solid NaBr forms SO₂. Write the balanced equation and explain the role of bromide ions. [3]',
 a:'<div class="eq">2NaBr + 3H₂SO₄ → 2NaHSO₄ + Br₂ + SO₂ + 2H₂O</div>✓✓<br>Bromide ions are oxidised to bromine — Br⁻ is acting as the reducing agent (reducing S from +6 to +4 in SO₂) ✓<div class="tip">💡 Halide reducing power: I⁻ > Br⁻ > Cl⁻. Br⁻ only reduces S as far as SO₂ (+4), while I⁻ can reduce it all the way to H₂S (−2).</div>'},

{id:'B13c',section:'B',topic:'Halogens',marks:2,
 q:'<b>Q13(c)</b> Explain why hydrogen fluoride has a higher boiling point than hydrogen chloride. [2]',
 a:'<b>Model answer:</b><br>HF has hydrogen bonding between molecules (F is small, highly electronegative, with lone pairs) ✓<br>HCl only has dipole-dipole and London forces, which are weaker and need less energy to overcome ✓'},

{id:'B14a',section:'B',topic:'Energetics I',marks:2,
 q:'<b>Q14(a)</b> Define <i>standard enthalpy change of combustion</i>. [2]',
 a:'<b>Model answer:</b><br>The enthalpy change when ONE MOLE of a substance is completely burned in oxygen ✓<br>under standard conditions (298 K, 100 kPa), all reactants and products in their standard states ✓'},

{id:'B14b',section:'B',topic:'Energetics I',marks:4,
 q:'<b>Q14(b)</b> Propane: C₃H₈(g) + 5O₂(g) → 3CO₂(g) + 4H₂O(l). Calculate ΔHc using mean bond enthalpies: C–H=412, C–C=348, O=O=496, C=O=743, O–H=463 kJ/mol. [4]',
 a:'<b>Bonds broken (reactants):</b><div class="eq">2(C–C) + 8(C–H) + 5(O=O)<br>= 2(348) + 8(412) + 5(496)<br>= 696 + 3296 + 2480 = 6472 kJ mol⁻¹</div>✓<b>Bonds made (products):</b><div class="eq">6(C=O) + 8(O–H)<br>= 6(743) + 8(463) = 4458 + 3704 = 8162 kJ mol⁻¹</div>✓<div class="eq">ΔH = bonds broken − bonds made = 6472 − 8162 = <b>−1690 kJ mol⁻¹</b></div>✓✓<div class="tip">💡 Count atoms carefully from the balanced equation FIRST (2 C–C bonds in propane\'s skeleton, 8 C–H bonds, 3×2=6 C=O in 3CO₂, 4×2=8 O–H in 4H₂O) before multiplying.</div>'},

{id:'B14c',section:'B',topic:'Energetics I',marks:1,
 q:'<b>Q14(c)</b> The experimental ΔHc of propane is −2043 kJ/mol, more exothermic than the bond-enthalpy calculated value. Suggest one reason. [1]',
 a:'<b>Model answer:</b><br>Mean bond enthalpies are AVERAGE values taken across many different compounds (not specific to propane) ✓ — OR bond enthalpies refer to the gaseous state, but water is actually liquid in the standard enthalpy of combustion, releasing extra energy on condensing.'},

{id:'B14d',section:'B',topic:'Energetics I',marks:2,
 q:'<b>Q14(d)</b> Define the term <i>mean bond enthalpy</i>. [2]',
 a:'<b>Model answer:</b><br>The enthalpy change when ONE MOLE of a given covalent bond is broken ✓<br>in the gaseous state, averaged over many different compounds/environments ✓'},

{id:'B15a',section:'B',topic:'Stoichiometry',marks:2,
 q:'<b>Q15(a)</b> Calculate the mass of Na₂CO₃ needed to prepare 250 cm³ of a 0.120 mol dm⁻³ solution. [2]',
 a:'<div class="eq">n = c × V = 0.120 × 0.250 = 0.0300 mol ✓<br>Mass = 0.0300 × 106.0 = <b>3.18 g</b> ✓</div>'},

{id:'B15b',section:'B',topic:'Stoichiometry',marks:3,
 q:'<b>Q15(b)</b> Na₂CO₃(aq)+2HCl(aq)→2NaCl(aq)+H₂O(l)+CO₂(g). 25.0 cm³ of 0.120 mol dm⁻³ Na₂CO₃ needs 22.40 cm³ HCl. Calculate [HCl]. [3]',
 a:'<div class="eq">n(Na₂CO₃) = 0.120 × (25.0/1000) = 3.00×10⁻³ mol ✓<br>n(HCl) = 2 × 3.00×10⁻³ = 6.00×10⁻³ mol ✓ (1:2 ratio)<br>[HCl] = 6.00×10⁻³ / (22.40/1000) = <b>0.268 mol dm⁻³</b> ✓</div>'},

{id:'B15c',section:'B',topic:'Stoichiometry',marks:2,
 q:'<b>Q15(c)</b> State one suitable indicator for this titration and the colour change at the end point. [2]',
 a:'<b>Model answer (either):</b><br>Methyl orange: yellow → orange/red ✓✓<br>OR Phenolphthalein: pink → colourless ✓✓<div class="tip">💡 For a weak-base/strong-acid-type equivalence point (Na₂CO₃ + HCl, final pH slightly acidic), methyl orange is the standard textbook choice.</div>'},

{id:'B16a',section:'B',topic:'Equilibrium II',marks:1,
 q:'<b>Q16(a)</b> Write the Kp expression for: N₂O₄(g) ⇌ 2NO₂(g) [1]',
 a:'<div class="eq">Kp = p(NO₂)² / p(N₂O₄)</div>✓'},

{id:'B16b',section:'B',topic:'Equilibrium II',marks:5,
 q:'<b>Q16(b)</b> A mixture contains 0.40 mol N₂O₄ and 0.80 mol NO₂ at total pressure 150 kPa. Calculate the partial pressures and Kp. [5]',
 a:'<div class="eq">Total moles = 0.40 + 0.80 = 1.20 mol ✓<br>Mole fraction N₂O₄ = 0.40/1.20 = 0.333 ✓<br>Mole fraction NO₂ = 0.80/1.20 = 0.667 ✓<br>p(N₂O₄) = 0.333 × 150 = 50 kPa ✓<br>p(NO₂) = 0.667 × 150 = 100 kPa ✓<br>Kp = (100)² / 50 = <b>200 kPa</b> ✓</div><div class="tip">💡 Partial pressure = mole fraction × total pressure. Always find mole fractions first, then multiply by the total.</div>'},

{id:'B16c',section:'B',topic:'Equilibrium II',marks:4,
 q:'<b>Q16(c)</b> State and explain the effect on the position of equilibrium of: (i) increasing temperature (ii) increasing total pressure. [2+2]',
 a:'<b>(i) Increasing temperature:</b><br>Equilibrium shifts RIGHT / towards NO₂ ✓<br>The forward reaction is endothermic (ΔH=+58), so increasing T favours the endothermic direction ✓<br><b>(ii) Increasing total pressure:</b><br>Equilibrium shifts LEFT / towards N₂O₄ ✓<br>Fewer moles of gas on the left (1 vs 2), so increased pressure favours the side with fewer gas molecules ✓'},

{id:'B16d',section:'B',topic:'Equilibrium II',marks:1,
 q:'<b>Q16(d)</b> State the effect of a catalyst on the value of Kp. [1]',
 a:'<b>No effect</b> ✓ — a catalyst speeds up both directions equally and never changes the equilibrium constant.'},

{id:'B17a',section:'B',topic:'Acid-Base',marks:2,
 q:'<b>Q17(a)</b> Calculate the pH of 0.25 mol dm⁻³ sodium hydroxide solution. (Kw = 1.0×10⁻¹⁴) [2]',
 a:'<div class="eq">[OH⁻] = 0.25 mol dm⁻³ ✓<br>pOH = −log(0.25) = 0.60<br>pH = 14 − 0.60 = <b>13.40</b> ✓</div>'},

{id:'B17b',section:'B',topic:'Acid-Base',marks:3,
 q:'<b>Q17(b)</b> Methanoic acid, Ka = 1.6×10⁻⁴ mol dm⁻³. Calculate the pH of 0.10 mol dm⁻³ methanoic acid. [3]',
 a:'<div class="eq">[H⁺]² = Ka × [HA] = 1.6×10⁻⁴ × 0.10 = 1.6×10⁻⁵ ✓<br>[H⁺] = 4.0×10⁻³ mol dm⁻³ ✓<br>pH = −log(4.0×10⁻³) = <b>2.40</b> ✓</div>'},

{id:'B17c',section:'B',topic:'Acid-Base',marks:3,
 q:'<b>Q17(c)</b> Buffer: 0.15 mol dm⁻³ methanoic acid + 0.10 mol dm⁻³ sodium methanoate. Calculate the pH. [3]',
 a:'<div class="eq">pKa = −log(1.6×10⁻⁴) = 3.80 ✓<br>pH = pKa + log([salt]/[acid]) = 3.80 + log(0.10/0.15) ✓<br>= 3.80 + log(0.667) = 3.80 − 0.176 = <b>3.62</b> ✓</div>'},

{id:'B17d',section:'B',topic:'Acid-Base',marks:2,
 q:'<b>Q17(d)</b> Explain, with an equation, how this buffer resists a pH change when a small amount of alkali is added. [2]',
 a:'<div class="eq">HCOOH + OH⁻ → HCOO⁻ + H₂O</div>✓ Added OH⁻ is neutralised by the weak acid component.<br>The ratio [salt]/[acid] changes only slightly, so pH remains approximately constant ✓'},

/* ===== SECTION C — EXTENDED RESPONSE ===== */
{id:'C18ai',section:'C',topic:'Energetics II',marks:2,
 q:'<b>Q18(a)(i)</b> Define the term <i>lattice enthalpy (dissociation)</i>. [2]',
 a:'<b>Model answer:</b><br>The enthalpy change when ONE MOLE of an ionic solid is separated ✓<br>into its gaseous ions (under standard conditions) ✓<div class="tip">💡 Two versions exist: lattice enthalpy of DISSOCIATION (solid → gaseous ions, always endothermic/positive) and lattice enthalpy of FORMATION (gaseous ions → solid, always exothermic/negative) — same magnitude, opposite sign. Always check which direction the question is asking for.</div>'},

{id:'C18aii',section:'C',topic:'Energetics II',marks:3,
 q:'<b>Q18(a)(ii)</b> Explain why the lattice enthalpy of CaO is more exothermic than that of NaCl. [3]',
 a:'<b>Model answer:</b><br>Ca²⁺ and O²⁻ have higher ionic charges than Na⁺ and Cl⁻ ✓<br>The ions in CaO are also smaller / have greater charge density ✓<br>This gives a stronger electrostatic attraction between the oppositely charged ions ✓'},

{id:'C18bi',section:'C',topic:'Energetics II',marks:4,
 q:'<b>Q18(b)(i)</b> Use the data (ΔH°f[CaCl₂]=−795, ΔH°at[Ca]=+193, IE1=+590, IE2=+1145, ΔH°at[Cl₂]=+121, EA1[Cl]=−349, all kJ/mol) to calculate the lattice enthalpy of formation of CaCl₂. [4]',
 a:'<div class="eq">−795 = (+193) + (+590) + (+1145) + 2(+121) + 2(−349) + ΔH°LE ✓✓<br>−795 = 193 + 590 + 1145 + 242 − 698 + ΔH°LE<br>−795 = 1472 + ΔH°LE<br>ΔH°LE = <b>−2267 kJ mol⁻¹</b> ✓✓</div><div class="trap">⚠️ Trap: CaCl₂ has TWO chlorines, so both the atomisation of Cl₂ AND the electron affinity of Cl must be doubled (×2) in the cycle — a very common lost-mark point.</div>'},

{id:'C18bii',section:'C',topic:'Energetics II',marks:2,
 q:'<b>Q18(b)(ii)</b> Theoretical LE(CaCl₂) = −2226 kJ/mol; experimental (Born-Haber) = −2258 kJ/mol. Explain the difference. [2]',
 a:'<b>Model answer:</b><br>The theoretical value assumes purely ionic bonding ✓<br>The actual bond has some covalent character — polarisation of Cl⁻ by the small, highly-charged Ca²⁺ ion ✓'},

{id:'C18c',section:'C',topic:'Energetics II',marks:2,
 q:'<b>Q18(c)</b> ΔH°sol(CaCl₂) = −82.9 kJ/mol. Calculate the sum of the hydration enthalpies of Ca²⁺ and 2Cl⁻, given LE = −2267 kJ/mol. [2]',
 a:'<div class="eq">ΔH°sol = ΔH°LE + ΣΔH°hyd<br>−82.9 = −2267 + ΣΔH°hyd<br>ΣΔH°hyd = −82.9 − (−2267) = <b>−2184.1 kJ mol⁻¹</b></div>✓✓ (using this paper\'s own LE value of −2267; mark scheme quotes ≈−2350 using a slightly different LE figure — always carry YOUR calculated LE value through consistently rather than mixing values).<div class="tip">💡 Always use the lattice enthalpy value YOU calculated in part (b)(i) here, for consistency — examiners award "error carried forward" marks.</div>'},

{id:'C19ai',section:'C',topic:'Redox II',marks:2,
 q:'<b>Q19(a)(i)</b> Define <i>standard electrode potential</i>. [2]',
 a:'<b>Model answer:</b><br>The electrode potential (e.m.f.) of a half-cell ✓<br>measured under standard conditions (298 K, 1 mol dm⁻³, 100 kPa), relative to the standard hydrogen electrode ✓'},

{id:'C19aii',section:'C',topic:'Redox II',marks:3,
 q:'<b>Q19(a)(ii)</b> Draw a labelled diagram of the standard hydrogen electrode. [3]',
 a:'<b>Required labelled features:</b><br>Pt electrode with H₂ gas bubbling over it at 100 kPa ✓<br>1 mol dm⁻³ H⁺(aq) solution ✓<br>Temperature stated as 298 K, with electrical connection point shown ✓'},

{id:'C19bi',section:'C',topic:'Redox II',marks:3,
 q:'<b>Q19(b)(i)</b> E°: Ag⁺/Ag = +0.80 V, Ni²⁺/Ni = −0.25 V. Write the overall spontaneous equation and calculate E°cell. [3]',
 a:'<div class="eq">2Ag⁺(aq) + Ni(s) → 2Ag(s) + Ni²⁺(aq)</div>✓✓ (balancing electrons: Ag⁺+e⁻→Ag doubled to match Ni→Ni²⁺+2e⁻)<div class="eq">E°cell = E°(reduction) − E°(oxidation) = 0.80 − (−0.25) = <b>+1.05 V</b></div>✓<div class="tip">💡 The half-cell with the MORE POSITIVE E° is always reduced (gains electrons); the more negative one is oxidised.</div>'},

{id:'C19bii',section:'C',topic:'Redox II',marks:1,
 q:'<b>Q19(b)(ii)</b> State the direction of electron flow in the external circuit. [1]',
 a:'<b>From the nickel electrode to the silver electrode</b> ✓ (electrons flow from the electrode where oxidation occurs — the more negative/anode — towards the electrode where reduction occurs).'},

{id:'C19ci',section:'C',topic:'Redox II',marks:1,
 q:'<b>Q19(c)(i)</b> Redox titration: Fe²⁺ titrated with potassium dichromate(VI). State the colour change at the end point. [1]',
 a:'<b>Answer: Orange → green</b> ✓<div class="tip">💡 Dichromate(VI), Cr₂O₇²⁻, is orange; it is reduced to green Cr³⁺ — unlike manganate(VII) titrations, dichromate needs a separate internal indicator (it isn\'t sharply self-indicating), though the colour change is still often used as a rough guide.</div>'},

{id:'C19cii',section:'C',topic:'Redox II',marks:4,
 q:'<b>Q19(c)(ii)</b> 25.0 cm³ Fe²⁺ titrated with 0.0250 mol dm⁻³ K₂Cr₂O₇, mean titre 16.80 cm³.<br>Cr₂O₇²⁻ + 6Fe²⁺ + 14H⁺ → 2Cr³⁺ + 6Fe³⁺ + 7H₂O<br>Calculate [Fe²⁺]. [4]',
 a:'<div class="eq">n(Cr₂O₇²⁻) = 0.0250 × (16.80/1000) = 4.20×10⁻⁴ mol ✓<br>n(Fe²⁺) = 6 × 4.20×10⁻⁴ = 2.52×10⁻³ mol ✓ (1:6 ratio)<br>[Fe²⁺] = 2.52×10⁻³ / (25.0/1000) = <b>0.101 mol dm⁻³</b> ✓✓</div><div class="trap">⚠️ Trap: dichromate reacts with Fe²⁺ in a 1:6 ratio, NOT 1:5 like manganate(VII) — always re-check the ratio from the given balanced equation, never assume it\'s the same as a manganate titration.</div>'},

{id:'C19d',section:'C',topic:'Transition Metals',marks:4,
 q:'<b>Q19(d)</b> Describe the colour changes when dilute NaOH is added slowly to aqueous CrCl₃, until NaOH is in excess. Give equations. [4]',
 a:'<b>Model answer:</b><br>Green solution → green precipitate forms ✓<br>Precipitate DISSOLVES in excess NaOH to give a (dark) green solution ✓<div class="eq">[Cr(H₂O)₆]³⁺ + 3OH⁻ → Cr(H₂O)₃(OH)₃ + 3H₂O</div>✓<div class="eq">Cr(H₂O)₃(OH)₃ + 3OH⁻ → [Cr(OH)₆]³⁻ + 3H₂O</div>✓<div class="tip">💡 Unlike Cu²⁺/NH₃ (which forms a soluble complex directly), this is amphoteric behaviour of Cr(OH)₃ — it dissolves in EXCESS hydroxide because chromium(III) hydroxide reacts with more OH⁻ to form a soluble hydroxo-complex.</div>'},

{id:'C20ai',section:'C',topic:'Transition Metals',marks:4,
 q:'<b>Q20(a)(i)</b> Explain why aqueous Cu²⁺ solutions are coloured, whereas aqueous Zn²⁺ solutions are colourless. [4]',
 a:'<b>Model answer:</b><br>Cu²⁺ has partially filled d orbitals ✓<br>Ligands (H₂O) cause the d orbitals to split into two energy levels ✓<br>Visible light is absorbed as an electron is promoted (a d–d transition occurs) ✓<br>Zn²⁺ has a FULL d subshell (d¹⁰), so no d–d transition is possible — no visible light is absorbed, hence colourless ✓'},

{id:'C20aii',section:'C',topic:'Transition Metals',marks:2,
 q:'<b>Q20(a)(ii)</b> State the oxidation state and co-ordination number of iron in [Fe(CN)₆]⁴⁻. [2]',
 a:'<b>Oxidation state: +2</b> ✓ (CN⁻ is a −1 charged ligand; 6×(−1) = −6, overall complex charge = −4, so Fe = −4 − (−6) = +2)<br><b>Co-ordination number: 6</b> ✓<div class="trap">⚠️ Trap: don\'t assume CN⁻ ligands are neutral like NH₃ or H₂O — cyanide carries a −1 charge that must be included in the overall charge balance.</div>'},

{id:'C20bi',section:'C',topic:'Organic/Redox',marks:2,
 q:'<b>Q20(b)(i)</b> Write the equation for acidified potassium dichromate(VI) + ethanol, C₂H₅OH → ethanal, CH₃CHO. [2]',
 a:'<div class="eq">Cr₂O₇²⁻ + 3C₂H₅OH + 8H⁺ → 2Cr³⁺ + 3CH₃CHO + 7H₂O</div>✓✓'},

{id:'C20bii',section:'C',topic:'Organic/Redox',marks:2,
 q:'<b>Q20(b)(ii)</b> In this reaction, explain whether ethanol is acting as an oxidising or reducing agent. [2]',
 a:'<b>Model answer:</b><br>Ethanol loses hydrogen / is oxidised to ethanal ✓<br>So ethanol is acting as the <b>reducing agent</b> (it reduces the dichromate, Cr going from +6 to +3, while itself being oxidised) ✓'},

{id:'C20ci',section:'C',topic:'Transition Metals',marks:2,
 q:'<b>Q20(c)(i)</b> Draw the structure of the optical isomers of [Cr(H₂O)₂(C₂O₄)₂]⁻. (C₂O₄²⁻ = bidentate ethanedioate) [2]',
 a:'<b>Model answer:</b><br>Two non-superimposable mirror-image structures drawn, each octahedral with 2 bidentate ethanedioate ligands and 2 H₂O ligands arranged around Cr ✓✓'},

{id:'C20cii',section:'C',topic:'Transition Metals',marks:2,
 q:'<b>Q20(c)(ii)</b> Explain why [Cr(H₂O)₂(C₂O₄)₂]⁻ shows optical isomerism. [2]',
 a:'<b>Model answer:</b><br>The complex has no plane of symmetry / no centre of symmetry ✓<br>The two mirror-image forms are non-superimposable on each other ✓<div class="tip">💡 Always use the word "non-superimposable" explicitly — examiners specifically credit this term for the explanation mark.</div>'},

{id:'C20d',section:'C',topic:'Transition Metals',marks:2,
 q:'<b>Q20(d)</b> Iron is used as a catalyst in the Haber Process. Explain why transition metals make good catalysts. [2]',
 a:'<b>Model answer:</b><br>Transition metals have variable oxidation states (can gain/lose electrons and change oxidation state easily) ✓<br>They can adsorb reactants onto their surface (weakening bonds), providing an alternative reaction pathway with lower activation energy ✓'},

/* ===== EXAM TECHNIQUE SUMMARY CARD ===== */
{id:'TIPS',section:'C',topic:'Exam Technique',marks:0,
 q:'<b>⭐ Paper 2 Reflections — Final Checklist</b><br>(tap to reveal — memorise before Paper 1)',
 a:'<b>1.</b> Kp units — always derive from the expression itself; don\'t guess. Pressure units carry all the way through.<br><b>2.</b> Buffer calculations — Henderson-Hasselbalch (pH = pKa + log([salt]/[acid])) saves time, but be ready to derive it from Ka if asked.<br><b>3.</b> Redox titrations — ALWAYS check the mole ratio from the given balanced equation (dichromate is 1:6 with Fe²⁺, manganate is 1:5 — never assume they match).<br><b>4.</b> Optical isomerism — draw both mirror images clearly and use the word "non-superimposable" to secure the explanation mark.<br><b>5.</b> Born-Haber cycles — watch for diatomic elements (½Cl₂, ½O₂) and DOUBLE the EA/atomisation terms when the formula has 2 of that ion (e.g. CaCl₂).<br><b>6.</b> Transition metal colour — always link to partially-filled d orbitals and d–d transitions; for Zn²⁺/Sc³⁺ (or any d¹⁰/d⁰ ion), state the d subshell is full/empty so no transition is possible.<div class="tip">💡 Highest-mark topics on this paper: Redox II (18), Transition Metals (16), Energetics II (13), Equilibrium (11) — prioritise these in revision time.</div>'},

/* ===== STATE ===== */
let currentSection='ALL';
let filtered=[];
let idx=0;
let flipped=false;
let progress=JSON.parse(localStorage.getItem('chemMock2Progress')||'{}');

const sections=[{k:'ALL',l:'All 54'},{k:'A',l:'Section A · MCQ'},{k:'B',l:'Section B'},{k:'C',l:'Section C'}];

function buildTabs(){
  const wrap=document.getElementById('tabs');
  wrap.innerHTML='';
  sections.forEach(s=>{
    const btn=document.createElement('div');
    btn.className='tab'+(s.k===currentSection?' active':'');
    btn.textContent=s.l;
    btn.onclick=()=>{currentSection=s.k;idx=0;flipped=false;applyFilter();render();};
    wrap.appendChild(btn);
  });
}
function applyFilter(){
  filtered = currentSection==='ALL'? cards.slice() : cards.filter(c=>c.section===currentSection);
}
function flipCard(){flipped=!flipped;render();}
function nextCard(){if(idx<filtered.length-1){idx++;flipped=false;render();}}
function prevCard(){if(idx>0){idx--;flipped=false;render();}}
function shuffleDeck(){
  for(let i=filtered.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[filtered[i],filtered[j]]=[filtered[j],filtered[i]];}
  idx=0;flipped=false;render();
}
function mark(id,status){
  progress[id]=status;
  localStorage.setItem('chemMock2Progress',JSON.stringify(progress));
  render();
}
function resetProgress(){
  if(confirm('Reset all know/review progress?')){progress={};localStorage.setItem('chemMock2Progress','{}');render();}
}
function render(){
  buildTabs();
  const c=filtered[idx];
  const el=document.getElementById('cardEl');
  document.getElementById('counter').textContent = `Card ${idx+1} of ${filtered.length}`;
  document.getElementById('prevBtn').disabled = idx===0;
  document.getElementById('nextBtn').disabled = idx===filtered.length-1;
  const st=progress[c.id];
  el.className='card'+(flipped?' backface':'');
  el.innerHTML=`
    <div class="tagrow">
      <div><span class="qid">${c.id}</span><br><span class="topicchip">${c.topic}</span></div>
      ${c.marks?`<span class="marks">${c.marks} mark${c.marks>1?'s':''}</span>`:''}
    </div>
    <div class="content">${flipped? c.a : c.q}</div>
    <div class="fliphint">${flipped? '↺ tap to see question' : '👆 tap card to reveal answer'}</div>
    <div class="actions">
      <button class="btn review ${st==='review'?'sel':''}" onclick="event.stopPropagation();mark('${c.id}','review')">🔴 Review</button>
      <button class="btn know ${st==='know'?'sel':''}" onclick="event.stopPropagation();mark('${c.id}','know')">🟢 Know it</button>
    </div>`;
  const known=Object.values(progress).filter(v=>v==='know').length;
  const review=Object.values(progress).filter(v=>v==='review').length;
  document.getElementById('statTotal').textContent=cards.length;
  document.getElementById('statKnow').textContent=known;
  document.getElementById('statReview').textContent=review;
  document.getElementById('progressFill').style.width = (Object.keys(progress).length/cards.length*100)+'%';
}

applyFilter();
render();
</script>
