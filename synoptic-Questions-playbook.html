<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Synoptic Question Playbook - Flashcards</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
body{padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 24px) 14px;max-width:720px;margin:0 auto}
h1{font-size:20px;margin:18px 0 2px;color:#2dd4bf}
.sub{font-size:13px;color:#8b949e;margin:0 0 12px}
.bar{height:8px;background:#161b22;border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,#2dd4bf,#a78bfa);transition:width .3s}
.stats{font-size:12px;color:#8b949e;display:flex;justify-content:space-between;margin-bottom:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;background:#161b22;border:1px solid #30363d;color:#c9d1d9;padding:7px 12px;border-radius:18px;font-size:13px;cursor:pointer}
.tab.on{background:#2dd4bf;color:#0d1117;border-color:#2dd4bf;font-weight:600}
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools button{flex:1;background:#161b22;border:1px solid #30363d;color:#c9d1d9;padding:9px;border-radius:10px;font-size:13px;cursor:pointer}
.card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:18px;min-height:330px;cursor:pointer;position:relative}
.chip{display:inline-block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:#a78bfa;border:1px solid #a78bfa;border-radius:10px;padding:2px 9px;margin-bottom:12px}
.q{font-size:20px;font-weight:600;color:#f0f6fc;margin:6px 0 14px}
.hint{font-size:13px;color:#8b949e;margin-top:18px}
.lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 4px}
.weak .lab{color:#f85149}
.good .lab{color:#2dd4bf}
.weak p{margin:0;color:#8b949e;text-decoration:line-through;text-decoration-color:#f8514988;font-size:15px}
.good p{margin:0;color:#e6edf3;font-size:15.5px;background:#0f2a2a;border-left:3px solid #2dd4bf;padding:10px 12px;border-radius:6px}
.nav{display:flex;gap:8px;margin-top:12px}
.nav button{flex:1;padding:13px 6px;border-radius:12px;border:1px solid #30363d;background:#161b22;color:#e6edf3;font-size:14px;cursor:pointer}
.nav .know{background:#12261e;border-color:#238636;color:#56d364}
.nav .rev{background:#2b1a1a;border-color:#da3633;color:#ff7b72}
.count{text-align:center;font-size:12px;color:#8b949e;margin-top:10px}
.mark{position:absolute;top:14px;right:14px;font-size:12px}
.mark.k{color:#56d364}
.mark.r{color:#ff7b72}
.empty{padding:40px 10px;text-align:center;color:#8b949e}
</style>
</head>
<body>
<h1>Synoptic Question Playbook</h1>
<p class="sub">Biology &middot; Chemistry &middot; Maths &middot; Know where to start</p>
<div class="bar"><div id="fill"></div></div>
<div class="stats"><span id="known">Known 0</span><span id="review">To review 0</span><span id="total">0 cards</span></div>
<div class="tabs" id="tabs"></div>
<div class="tools"><button id="shuf">Shuffle</button><button id="reset">Reset progress</button></div>
<div id="stage"></div>
<div class="nav" id="nav">
<button id="prev">Prev</button>
<button class="rev" id="rev">Review</button>
<button class="know" id="knw">Got it</button>
<button id="next">Next</button>
</div>
<div class="count" id="count"></div>

<script>
var T={ME:"START method",BI:"Biology",CH:"Chemistry",MA:"Maths",DA:"Data and skills"};
var C=[
["ME","What does START stand for?","Read it again and hope.","S Scan (marks, command word, data). T Tag (underline keywords, write the topic). A Arrange (split into numbered mini-questions). R Reply (one point per sentence, in context). T Tie together (finish with Therefore ... answering the exact question)."],
["ME","The 60-second rule","Stare at the question until an idea comes.","Within 60 seconds write: the marks, 2 to 4 topic tags, and the mini-questions. Then answer the easiest mini-question first. A start on an easy part unlocks the harder parts."],
["ME","Why combined questions are not hard","This question is too big.","A combined question is several small questions in one coat. Name the topics, split into mini-questions, answer each in order, then link them."],
["ME","Matching the marks","Writes one general paragraph.","Count the marks and match the number of distinct points: 6 marks needs at least 6 separate points or steps. One idea per sentence."],
["ME","Linking phrase: chain","Joins two ideas with and.","This causes ... which leads to ... : for example the enzyme is denatured, which causes fewer enzyme-substrate complexes, which leads to a lower rate."],
["ME","Linking phrase: reason","Gives the result without a reason.","This is because ... : the rate is higher because there are more frequent collisions between reactant particles."],
["ME","Linking phrase: conclusion","Stops at the last calculation.","Finish with Therefore ... or Overall ... using the words of the question."],
["ME","Command word: Explain how and why (6 marks)","Writes everything about the topic.","It tests a chain of cause and effect across topics. Draw an arrow chain: trigger, step, step, result. Each arrow is a mark point."],
["ME","Command word: Use the information provided and your knowledge","Writes only from memory.","Quote one number or feature from the data, then name the idea that explains it. Both the data and the knowledge are needed."],
["ME","Command word: Evaluate / To what extent","Gives one side.","Make two columns: supports and limits. Finish with a judgement sentence that answers to what extent."],
["ME","Command word: Discuss","Gives one opinion.","List three factors, give each a point and a reason, then conclude."],
["ME","Command word: Suggest why","Says I have not seen this.","Ask which topic this really is. Write the principle first, then apply it to the new context."],
["ME","Command word: Predict and justify","Gives a prediction only.","State the principle (Le Chatelier, Hardy-Weinberg, chain rule), apply it, then state the prediction."],
["ME","Command word: Compare and contrast","Describes each item separately.","Choose three features and write one sentence per feature covering both items, using words such as whereas and both."],
["ME","Command word: Show that","Jumps to the printed answer.","Write the given result at the top, work forwards from the data, and arrive at it with every step shown."],
["ME","Finding the bridge between topics","The topics seem unrelated.","Ask what the bridge is: rate, equilibrium or balance, quantity conserved, structure and function, or energy."],
["ME","Stuck completely","Leaves it blank.","Complete S, T and A on paper, write the formula or principle for the easiest mini-question, and begin. Method marks are available without the final answer."],
["BI","Mutation, enzyme and rate","A mutation makes the enzyme not work.","DNA base sequence changes, so a different codon and amino acid; the tertiary structure changes; the active site shape changes; fewer enzyme-substrate complexes form; the rate decreases."],
["BI","Poison blocks the electron transport chain, active transport stops","It stops the cell working.","Less proton gradient, so less ATP by oxidative phosphorylation; active transport needs ATP to change the shape of the carrier protein; uptake against the gradient stops."],
["BI","Graph: rate against light intensity then a plateau","The rate goes up then stays the same.","Describe with figures. At low intensity light is limiting because less ATP and reduced NADP is made in the light-dependent reaction. At the plateau another factor such as carbon dioxide or temperature is limiting."],
["BI","How a new allele becomes common","Evolution happens.","Mutation creates the allele; it is passed on in gametes; a selective advantage means those individuals survive and reproduce more; the allele frequency increases over generations."],
["BI","Vaccine and memory","Your body remembers.","Antigen is presented; a specific B cell with a complementary receptor is selected and divides by mitosis; plasma cells and memory cells form; on re-infection memory cells give a faster and stronger secondary response."],
["BI","Why a large organism needs a transport system","It is bigger so it needs more.","Smaller SA:V ratio and longer diffusion distance, so diffusion alone is too slow for the metabolic demand; a mass transport system maintains a steep concentration gradient."],
["BI","Blood glucose after a meal","Insulin lowers it.","Stimulus: glucose rises; beta cells detect it; insulin is released; liver and muscle take up glucose and form glycogen by glycogenesis; glucose falls and insulin secretion decreases: negative feedback."],
["BI","Compare two sites in ecology","Site A has more species.","Random quadrats using random coordinates; compare mean abundance; apply an appropriate statistical test; compare with the critical value at p = 0.05; conclude with reference to the null hypothesis."],
["BI","Explain how a drug could lower heart rate","It slows the heart.","Name the target (for example beta receptors on the SAN); block or bind; fewer impulses; lower frequency of contraction; link to cardiac output = heart rate x stroke volume."],
["BI","Antibiotic resistance","The bacteria get used to it.","Random mutation gives resistance; antibiotic is the selection pressure; resistant bacteria survive and reproduce; allele passed on by vertical transmission; frequency of resistance increases."],
["BI","Hardy-Weinberg question","Cannot start.","Write p + q = 1 and p^2 + 2pq + q^2 = 1. Identify the given frequency (usually q^2), find q by square root, then p, then 2pq."],
["BI","Describe and explain an enzyme graph","The graph goes up then down.","Describe with figures. Rise: more kinetic energy, more collisions. Optimum value. Fall: bonds break, tertiary structure changes, active site denatured."],
["CH","Titration, moles and percentage purity","Uses the numbers in the formula.","Moles of titrant n = c x V (dm3); mole ratio from the equation; scale up for the whole sample; mass = n x Mr; purity = mass of pure over mass of sample x 100."],
["CH","Temperature for an exothermic equilibrium","A higher temperature is faster.","Higher temperature moves equilibrium to the endothermic side, so lower yield (Le Chatelier), but the rate increases because more particles have energy greater than Ea; a compromise is used."],
["CH","Why one lattice enthalpy is more exothermic","It is stronger.","Smaller ionic radius or higher ionic charge gives stronger electrostatic attraction between the ions, so the lattice enthalpy is more exothermic."],
["CH","Identify an unknown from spectra","Guess a compound.","Molecular ion gives Mr; IR peaks give functional groups (1700 cm-1 is C=O); NMR gives environments and splitting; assemble a structure; check that it fits all the data."],
["CH","Rate equation from data","The rate goes up.","Compare experiments where one concentration changes; deduce the order for each reactant; write rate = k[A][B]^2; calculate k with units; species in the rate equation are in the rate-determining step."],
["CH","pH of a mixture","Uses the pH formula for the acid.","Find moles of acid and base, decide which is in excess, then find the concentration of excess H+ (strong) or use Ka and the ratio for a buffer."],
["CH","Is a redox reaction feasible?","The E value is positive.","E cell = E reduction minus E oxidation. A positive E cell means feasible, but the reaction may be slow because of a high activation energy."],
["CH","Why transition metal complexes are coloured","They absorb light.","Ligands split the d orbitals; an electron is promoted; the energy gap matches the frequency of light absorbed; the complementary colour is seen."],
["CH","The Haber process conditions","High pressure is best for yield.","Exothermic, so low temperature favours yield but is slow; 450 degrees Celsius is a compromise. 4 moles to 2 moles of gas, so high pressure favours yield but is costly. The iron catalyst lowers Ea and speeds the rate without changing the yield."],
["CH","Multi-step calculation chain","Puts the numbers in a formula.","Balanced equation, moles of the known substance (dm3), mole ratio, moles of the required substance, convert to the quantity asked (mass, concentration, volume), round to the data significant figures."],
["CH","Percentage yield and atom economy","Mixes them up.","Percentage yield = actual moles over theoretical moles x 100 (efficiency). Atom economy = Mr of desired product over total Mr of products x 100 (waste)."],
["CH","Organic synthesis route","Writes the product only.","For each step name the reactant, reagent, conditions and the mechanism type: for example haloalkane to alcohol: aqueous NaOH, reflux, nucleophilic substitution."],
["CH","Buffer action","It keeps the pH steady.","The buffer contains a weak acid and its conjugate base. Added H+ reacts with the conjugate base; added OH- reacts with the weak acid; the ratio changes only slightly, so pH barely changes."],
["CH","Enthalpy cycle (Hess)","Adds the numbers.","Draw the cycle, label each arrow with its enthalpy, choose the route, and apply the sign: going against an arrow reverses the sign."],
["MA","Tide model: time of maximum rise","Substitutes numbers randomly.","Differentiate: dh/dt = Rb cos(bt + c); the maximum is when cos = 1; solve bt + c = 0 plus 360n; convert to a time and state it in context with units."],
["MA","Find a and n in y = a x^n","Cannot see how.","Take logs: log y = log a + n log x. Compare with y = mx + c: gradient n, intercept log a, so a = 10 to the power of the intercept."],
["MA","First year the series total exceeds a target","Adds terms one by one.","Identify the series, write S_n, form the inequality S_n > target, use logs to solve for n, remembering that dividing by a negative log reverses the inequality, and round up to the next whole year."],
["MA","Area under a parametric curve","Integrates y with respect to x.","Area = integral of y (dx/dt) dt; change the limits to t; use an identity such as double angle to integrate; evaluate and give the result."],
["MA","Rate problem leading to a differential equation","Does not know what to integrate.","Write dV/dt = -kV, separate variables, integrate both sides with +c, use the initial condition, and state the answer in context."],
["MA","Prove a property of consecutive integers","Tests 2, 3 and 4.","Let the numbers be n and n + 1. Expand and simplify, take out a common factor, then conclude: this is a multiple of 2, so it is even."],
["MA","Angle between two vectors","Draws a sketch only.","Write both vectors, use cos theta = a dot b over |a||b|, calculate, and state the angle to the required accuracy."],
["MA","Hypothesis test in context","Calculates a probability only.","Define the model X ~ B(n, p), write H0 and H1 in context, find the p-value or critical region, compare with the significance level and conclude in context."],
["MA","Projectile with components","Uses suvat once.","Resolve into horizontal and vertical components; use time as the common link; apply suvat in each direction; combine; interpret the answer in context."],
["MA","Topic ladder: four questions","Waits for inspiration.","1 What is given? 2 What is asked (in symbols)? 3 What tool bridges the two? 4 What is the first line of working?"],
["MA","Use hence correctly","Starts a new method.","Hence means use the previous part. Write the part (a) result beside part (b) and use it in the first line."],
["MA","Model and interpret","Gives a number.","Define variables with units, write the equation, solve, then interpret the result in the context, and comment on the limitation of the model."],
["MA","Population model P = 200e^(0.05t): first exceeds 1000","Tries values until it works.","200e^(0.05t) > 1000 so e^(0.05t) > 5; take natural logs: 0.05t > ln 5; t > 32.2. The population first exceeds 1000 after 32.2 time units."],
["DA","Reading a graph in three layers","The graph increases.","Describe with figures from the graph, explain with the correct concept, conclude in the words of the question."],
["DA","Rate from a graph","Reads off the y value.","Draw a tangent at the point; rate = change in y over change in x; give the units."],
["DA","Percentage change","Subtracts the numbers.","(final minus initial) over initial x 100, with the sign shown."],
["DA","Magnification","Multiplies by a number.","Magnification = image size over actual size; convert to the same units first (mm to micrometres)."],
["DA","Log scales and pH","pH goes up so it is more acidic.","pH = -log10[H+]. A change of one pH unit is a ten-fold change in H+ concentration."],
["DA","Error bars","The values are different.","Overlapping error bars suggest the difference may not be significant; non-overlapping suggests a real difference. Quote the values."],
["DA","Statistical test wording","The test shows it is true.","State the null hypothesis, calculate the test value, compare with the critical value at p = 0.05, then conclude: reject or fail to reject the null hypothesis, in context."],
["DA","Evaluate an experiment","It was a fair test.","Comment on sample size, controls, repeats, range and resolution of the measuring equipment, and say how each limitation affects the conclusion."],
["DA","Data question checklist","Looks quickly at the graph.","Check axes and units, trend, two quoted values, anomalies, limits of the data and the topic that explains the pattern."]
];
var KEY="synopticProgress";
var prog={};
try{prog=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){prog={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(prog))}catch(e){}}
function cid(i){return C[i][0]+":"+C[i][1]}

var tabKey="ALL",order=[],pos=0,flipped=false;
var tabsEl=document.getElementById("tabs"),stage=document.getElementById("stage"),countEl=document.getElementById("count");

function tabList(){
  var l=[["ALL","All"],["REV","To review"]];
  for(var k in T)l.push([k,T[k]]);
  return l;
}
function buildTabs(){
  tabsEl.innerHTML="";
  tabList().forEach(function(t){
    var b=document.createElement("div");b.className="tab"+(t[0]===tabKey?" on":"");b.textContent=t[1];
    b.onclick=function(){tabKey=t[0];pos=0;flipped=false;makeOrder();buildTabs();render()};
    tabsEl.appendChild(b);
  });
}
function makeOrder(){
  order=[];
  for(var i=0;i<C.length;i++){
    if(tabKey==="ALL"||C[i][0]===tabKey||(tabKey==="REV"&&prog[cid(i)]==="r"))order.push(i);
  }
}
function stats(){
  var k=0,r=0;
  for(var i=0;i<C.length;i++){var s=prog[cid(i)];if(s==="k")k++;else if(s==="r")r++}
  document.getElementById("known").textContent="Known "+k;
  document.getElementById("review").textContent="To review "+r;
  document.getElementById("total").textContent=C.length+" cards";
  document.getElementById("fill").style.width=(C.length?Math.round(k/C.length*100):0)+"%";
}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function render(){
  stats();stage.innerHTML="";
  if(!order.length){stage.appendChild(el("div","empty","No cards here yet. Mark some cards as Review to see them in this tab."));countEl.textContent="";return}
  if(pos>=order.length)pos=0;if(pos<0)pos=order.length-1;
  var i=order[pos],c=C[i];
  var card=el("div","card");
  card.appendChild(el("div","chip",T[c[0]]));
  var s=prog[cid(i)];
  if(s==="k")card.appendChild(el("div","mark k","Known"));
  if(s==="r")card.appendChild(el("div","mark r","Review"));
  card.appendChild(el("div","q",c[1]));
  if(!flipped){
    card.appendChild(el("div","hint","Write the S, T, A steps first, then tap the card to see the START breakdown."));
  }else{
    var w=el("div","weak");w.appendChild(el("div","lab","Stuck answer - loses marks"));w.appendChild(el("p","",c[2]));card.appendChild(w);
    var g=el("div","good");g.appendChild(el("div","lab","START breakdown - scores"));g.appendChild(el("p","",c[3]));card.appendChild(g);
  }
  card.onclick=function(){flipped=!flipped;render()};
  stage.appendChild(card);
  countEl.textContent=(pos+1)+" / "+order.length;
}
function go(d){pos+=d;flipped=false;render()}
function mark(v){
  if(!order.length)return;
  prog[cid(order[pos])]=v;save();
  if(tabKey==="REV"&&v==="k"){makeOrder();flipped=false;render();return}
  go(1);
}
document.getElementById("prev").onclick=function(){go(-1)};
document.getElementById("next").onclick=function(){go(1)};
document.getElementById("knw").onclick=function(){mark("k")};
document.getElementById("rev").onclick=function(){mark("r")};
document.getElementById("shuf").onclick=function(){
  for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t}
  pos=0;flipped=false;render();
};
document.getElementById("reset").onclick=function(){
  if(confirm("Reset all progress?")){prog={};save();makeOrder();pos=0;flipped=false;render()}
};
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight")go(1);
  else if(e.key==="ArrowLeft")go(-1);
  else if(e.key===" "){e.preventDefault();flipped=!flipped;render()}
});
buildTabs();makeOrder();render();
</script>
</body>
</html>
