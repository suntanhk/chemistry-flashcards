<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chemistry Mock Paper 4 — Flashcards</title>
<style>
  :root{
    --bg:#0a0e17; --bg2:#0f1524; --card:#141b2d; --card2:#182238;
    --accent:#2dd4bf; --accent2:#22b8a3; --amber:#fbbf24; --red:#f87171;
    --green:#4ade80; --text:#e5e9f0; --muted:#8b95a8; --border:#243044;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh;padding-bottom:40px;}
  header{padding:18px 16px 10px;text-align:center;position:sticky;top:0;background:rgba(10,14,23,0.96);
    backdrop-filter:blur(8px);z-index:20;border-bottom:1px solid var(--border);}
  h1{font-size:1.15rem;margin:0 0 2px;background:linear-gradient(90deg,var(--accent),#818cf8);
    -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;}
  .sub{font-size:0.72rem;color:var(--muted);margin-bottom:10px;}
  .progress-wrap{max-width:520px;margin:0 auto;}
  .progress-bar{height:6px;background:var(--border);border-radius:6px;overflow:hidden;margin-top:6px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#818cf8);width:0%;transition:width .3s;}
  .stats{display:flex;justify-content:center;gap:14px;margin-top:6px;font-size:0.68rem;color:var(--muted);}
  .stats span.k{color:var(--green);} .stats span.r{color:var(--red);}
  .tabs{display:flex;overflow-x:auto;gap:6px;padding:10px 12px 4px;max-width:560px;margin:0 auto;
    -ms-overflow-style:none;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;padding:7px 13px;border-radius:20px;background:var(--card);border:1px solid var(--border);
    color:var(--muted);font-size:0.72rem;font-weight:600;white-space:nowrap;cursor:pointer;}
  .tab.active{background:linear-gradient(90deg,var(--accent),#22b8a3);color:#04211c;border-color:transparent;}
  main{max-width:560px;margin:0 auto;padding:14px 14px 0;}
  .counter{text-align:center;font-size:0.75rem;color:var(--muted);margin-bottom:8px;}
  .deck{position:relative;height:420px;}
  .card{position:absolute;inset:0;background:var(--card);border:1px solid var(--border);border-radius:18px;
    padding:20px;display:flex;flex-direction:column;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,0.35);
    transition:transform .15s;overflow:hidden;}
  .card:active{transform:scale(0.985);}
  .tagrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .qid{font-size:0.68rem;font-weight:800;color:var(--accent);letter-spacing:.5px;}
  .marks{font-size:0.65rem;background:var(--card2);color:var(--amber);padding:3px 9px;border-radius:10px;
    font-weight:700;border:1px solid var(--border);}
  .topicchip{font-size:0.62rem;color:var(--muted);background:var(--bg2);padding:2px 8px;border-radius:8px;margin-top:2px;display:inline-block;}
  .content{flex:1;overflow-y:auto;font-size:0.92rem;line-height:1.55;padding-right:2px;}
  .content b{color:var(--accent);}
  .content .tip{margin-top:10px;padding:9px 10px;background:rgba(251,191,36,0.08);border-left:3px solid var(--amber);
    border-radius:6px;font-size:0.8rem;color:#fde68a;}
  .content .trap{margin-top:8px;padding:9px 10px;background:rgba(248,113,113,0.08);border-left:3px solid var(--red);
    border-radius:6px;font-size:0.8rem;color:#fecaca;}
  .content .eq{font-family:'Courier New',monospace;background:var(--bg2);padding:8px 10px;border-radius:8px;
    margin:6px 0;font-size:0.85rem;color:#93e8db;border:1px solid var(--border);}
  .fliphint{text-align:center;font-size:0.65rem;color:var(--muted);margin-top:8px;}
  .backface{background:var(--card2);}
  .actions{display:flex;gap:10px;margin-top:12px;}
  .btn{flex:1;padding:11px;border-radius:12px;border:none;font-weight:700;font-size:0.85rem;cursor:pointer;}
  .btn.review{background:rgba(248,113,113,0.15);color:var(--red);border:1px solid rgba(248,113,113,0.4);}
  .btn.know{background:rgba(74,222,128,0.15);color:var(--green);border:1px solid rgba(74,222,128,0.4);}
  .btn.review.sel{background:var(--red);color:#1a0505;}
  .btn.know.sel{background:var(--green);color:#052712;}
  .navrow{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;}
  .navbtn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 18px;
    border-radius:12px;font-size:0.85rem;font-weight:700;cursor:pointer;}
  .navbtn:disabled{opacity:0.3;}
  .resetrow{text-align:center;margin-top:18px;}
  .resetbtn{background:none;border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:10px;
    font-size:0.7rem;cursor:pointer;}
  table.mini{width:100%;border-collapse:collapse;margin:6px 0;font-size:0.78rem;}
  table.mini td,table.mini th{border:1px solid var(--border);padding:4px 6px;text-align:left;}
  table.mini th{background:var(--bg2);color:var(--accent);}
</style>
</head>
<body>
<header>
  <h1>🧪 Chemistry Mock Paper 4</h1>
  <div class="sub">Edexcel 9CH0/01 · Advanced Inorganic &amp; Physical Chemistry · 90 marks · for Jody</div>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="stats">
      <span>Total: <b id="statTotal">0</b></span>
      <span class="k">Know: <span id="statKnow">0</span></span>
      <span class="r">Review: <span id="statReview">0</span></span>
    </div>
  </div>
</header>

<div class="tabs" id="tabs"></div>

<main>
  <div class="counter" id="counter"></div>
  <div class="deck">
    <div class="card" id="cardEl" onclick="flipCard()"></div>
  </div>
  <div class="navrow">
    <button class="navbtn" id="prevBtn" onclick="prevCard()">← Prev</button>
    <button class="navbtn" id="shuffleBtn" onclick="shuffleDeck()">🔀 Shuffle</button>
    <button class="navbtn" id="nextBtn" onclick="nextCard()">Next →</button>
  </div>
  <div class="resetrow"><button class="resetbtn" onclick="resetProgress()">Reset all progress</button></div>
</main>

<script>
const cards = [
/* ===== SECTION A — MULTIPLE CHOICE (1 mark each) ===== */
{id:'A1',section:'A',topic:'Atomic Structure',marks:1,
 q:'<b>Q1.</b> Which ion has the electron configuration [Ar]3d³?<br><br>A. Cr³⁺&nbsp;&nbsp; B. Fe²⁺&nbsp;&nbsp; C. Mn²⁺&nbsp;&nbsp; D. Cu²⁺',
 a:'<b>Answer: A — Cr³⁺</b><br>Cr (anomalous config): [Ar]3d⁵4s¹ → Cr³⁺ = [Ar]3d³ (loses the 4s¹ electron and 2 more from 3d).<div class="tip">💡 Cr and Cu are the two classic anomalous configurations (3d⁵4s¹ and 3d¹⁰4s¹, not the "expected" 3d⁴4s² / 3d⁹4s²) — always double-check these two specifically.</div>'},

{id:'A2',section:'A',topic:'Bonding',marks:1,
 q:'<b>Q2.</b> Which substance has the most exothermic lattice enthalpy?<br><br>A. NaF&nbsp;&nbsp; B. NaCl&nbsp;&nbsp; C. MgO&nbsp;&nbsp; D. MgCl₂',
 a:'<b>Answer: C — MgO</b><br>Higher ionic charges (2+/2−) AND smaller ions than Na⁺/Cl⁻ combine to give the strongest electrostatic attraction and most exothermic lattice enthalpy.'},

{id:'A3',section:'A',topic:'Redox I',marks:1,
 q:'<b>Q3.</b> What is the oxidation state of chromium in Cr₂O₇²⁻?<br><br>A. +3&nbsp;&nbsp; B. +4&nbsp;&nbsp; C. +6&nbsp;&nbsp; D. +7',
 a:'<div class="eq">7 × (−2) = −14; overall charge = −2<br>2×Cr = −2 − (−14) = +12 → Cr = <b>+6</b></div><b>Answer: C</b>'},

{id:'A4',section:'A',topic:'Equilibrium I',marks:1,
 q:'<b>Q4.</b> For H₂(g)+I₂(g)⇌2HI(g), what is the effect of increasing total pressure on the value of Kc?<br><br>A. Kc increases<br>B. Kc decreases<br>C. Kc remains unchanged<br>D. Kc becomes zero',
 a:'<b>Answer: C — Kc remains unchanged</b><br>Kc (and Kp) depend ONLY on temperature. Pressure changes shift the position of equilibrium but never change the value of the equilibrium constant itself.'},

{id:'A5',section:'A',topic:'Periodicity',marks:1,
 q:'<b>Q5.</b> Which Period 3 oxide reacts with both dilute HCl and dilute NaOH solution?<br><br>A. Na₂O&nbsp;&nbsp; B. MgO&nbsp;&nbsp; C. Al₂O₃&nbsp;&nbsp; D. SiO₂',
 a:'<b>Answer: C — Al₂O₃</b><br>Amphoteric — reacts with acids (acting as a base) AND with alkalis (acting as an acid). Na₂O and MgO are purely basic; SiO₂ is purely acidic.'},

{id:'A6',section:'A',topic:'Acid-Base',marks:1,
 q:'<b>Q6.</b> What is the pH of a 0.010 mol dm⁻³ solution of Ba(OH)₂? (Kw = 1.0×10⁻¹⁴)<br><br>A. 2.0&nbsp;&nbsp; B. 12.0&nbsp;&nbsp; C. 12.3&nbsp;&nbsp; D. 13.0',
 a:'<div class="eq">[OH⁻] = 2 × 0.010 = 0.020 mol dm⁻³<br>pOH = −log(0.020) = 1.70<br>pH = 14 − 1.70 = <b>12.30</b></div><b>Answer: C</b><div class="trap">⚠️ Trap: always double the concentration for Group 2 hydroxides — 2 OH⁻ ions per formula unit.</div>'},

{id:'A7',section:'A',topic:'Transition Metals',marks:1,
 q:'<b>Q7.</b> Which complex ion has a tetrahedral shape?<br><br>A. [Co(NH₃)₆]²⁺&nbsp;&nbsp; B. [CoCl₄]²⁻&nbsp;&nbsp; C. [Ni(CN)₄]²⁻&nbsp;&nbsp; D. [Cu(H₂O)₆]²⁺',
 a:'<b>Answer: B — [CoCl₄]²⁻</b><br>Co²⁺ with large Cl⁻ ligands forms tetrahedral complexes (4 large ligands pack more easily as a tetrahedron than an octahedron). [Ni(CN)₄]²⁻ is square planar (low-spin d⁸ with strong-field CN⁻); the other two are octahedral (6 ligands).'},

{id:'A8',section:'A',topic:'Kinetics',marks:1,
 q:'<b>Q8.</b> Rate = k[A][B]. If [A] is doubled and [B] is tripled, by what factor does the rate increase?<br><br>A. 2&nbsp;&nbsp; B. 3&nbsp;&nbsp; C. 5&nbsp;&nbsp; D. 6',
 a:'<div class="eq">New rate = k(2[A])(3[B]) = 6 × k[A][B] = 6 × original rate</div><b>Answer: D — 6</b>'},

{id:'A9',section:'A',topic:'Energetics',marks:1,
 q:'<b>Q9.</b> Which statement about entropy is correct?<br><br>A. Entropy decreases when a solid dissolves in water<br>B. Entropy decreases when a gas condenses to a liquid<br>C. A negative ΔS°system always means a reaction is not feasible<br>D. Entropy is measured in J mol⁻¹',
 a:'<b>Answer: B</b><br>Gas → liquid means far less disorder/fewer accessible microstates, so entropy decreases. (A is wrong — dissolving usually increases disorder; C is wrong — feasibility depends on ΔG, not ΔS alone; D is wrong — entropy units are J K⁻¹ mol⁻¹, not J mol⁻¹.)'},

{id:'A10',section:'A',topic:'Redox II',marks:1,
 q:'<b>Q10.</b> E°(Zn²⁺/Zn) = −0.76 V, E°(Cu²⁺/Cu) = +0.34 V. What is E°cell for the reaction between zinc and copper(II) ions?<br><br>A. −1.10 V&nbsp;&nbsp; B. +0.42 V&nbsp;&nbsp; C. +1.10 V&nbsp;&nbsp; D. +1.44 V',
 a:'<div class="eq">E°cell = E°(reduction) − E°(oxidation) = 0.34 − (−0.76) = <b>+1.10 V</b></div><b>Answer: C</b>'},

/* ===== SECTION B ===== */
{id:'B11a',section:'B',topic:'Atomic Structure',marks:2,
 q:'<b>Q11(a)</b> Cl isotopes: ³⁵Cl (75%) and ³⁷Cl (25%). Calculate the RAM of chlorine to 1 d.p. [2]',
 a:'<div class="eq">RAM = [(75×35) + (25×37)] / 100 = (2625 + 925) / 100 = 3550/100 = <b>35.5</b></div>✓✓'},

{id:'B11b',section:'B',topic:'Atomic Structure',marks:1,
 q:'<b>Q11(b)</b> Write an equation, including state symbols, for the first ionisation energy of chlorine. [1]',
 a:'<div class="eq">Cl(g) → Cl⁺(g) + e⁻</div>✓'},

{id:'B11c',section:'B',topic:'Atomic Structure',marks:2,
 q:'<b>Q11(c)</b> Explain why the second ionisation energy of sodium is much larger than its first. [2]',
 a:'<b>Model answer:</b><br>The second electron is removed from an already positive ion, Na⁺, which has the stable noble-gas configuration [Ne] ✓<br>This electron comes from a full INNER shell — much closer to the nucleus with far less shielding, so nuclear attraction is far greater ✓<div class="tip">💡 For Group 1 metals specifically, IE2 is a HUGE jump (roughly 10× IE1) because the electron removed comes from a completely different (inner) shell, not just a subshell within the same shell.</div>'},

{id:'B12a',section:'B',topic:'Bonding',marks:2,
 q:'<b>Q12(a)</b> Draw a dot-and-cross diagram for H₂O, outer electrons only. [2]',
 a:'<b>Model answer:</b><br>Two O–H bonds, each shown as a shared pair (1 dot + 1 cross) ✓<br>Two lone pairs shown on the oxygen atom ✓'},

{id:'B12b',section:'B',topic:'Bonding',marks:2,
 q:'<b>Q12(b)</b> State the shape of H₂O and its bond angle. Explain using electron pair repulsion. [max 2]',
 a:'<b>Model answer:</b><br>Shape: <b>bent / V-shaped</b> ✓ &nbsp; Bond angle: <b>104.5°</b> ✓<br>2 bonding pairs + 2 lone pairs around O; lone pair–bonding pair (and lone pair–lone pair) repulsion is stronger than bonding pair–bonding pair repulsion, squeezing the angle below the tetrahedral 109.5°.'},

{id:'B12c',section:'B',topic:'Bonding',marks:1,
 q:'<b>Q12(c)</b> Explain why water has a higher boiling point than hydrogen sulfide, H₂S. [1]',
 a:'<b>Model answer:</b><br>Water has hydrogen bonding between molecules (O is small and highly electronegative) ✓ — H₂S only has weaker dipole-dipole and London forces (S is larger and less electronegative, so no hydrogen bonding forms).'},

{id:'B13a',section:'B',topic:'Group Chemistry',marks:2,
 q:'<b>Q13(a)</b> Write equations, with state symbols, for the reactions of sodium and magnesium with water. [2]',
 a:'<div class="eq">2Na(s) + 2H₂O(l) → 2NaOH(aq) + H₂(g)</div>✓<div class="eq">Mg(s) + H₂O(g) → MgO(s) + H₂(g)</div>✓<div class="tip">💡 Mg reacts very slowly with cold water but readily with STEAM — this is why the equation uses H₂O(g), not H₂O(l), and gives MgO rather than Mg(OH)₂.</div>'},

{id:'B13b',section:'B',topic:'Group Chemistry',marks:2,
 q:'<b>Q13(b)</b> Explain why the reactivity of Group 2 elements increases down the group. [2]',
 a:'<b>Model answer:</b><br>Atomic radius increases down the group ✓<br>Increased shielding means nuclear attraction on the outer (valence) electrons decreases, so they are easier to remove — lower ionisation energy drives greater reactivity ✓'},

{id:'B13c',section:'B',topic:'Group Chemistry',marks:1,
 q:'<b>Q13(c)</b> Explain why aluminium oxide is described as amphoteric. [1]',
 a:'<b>Model answer:</b><br>Al₂O₃ reacts with BOTH acids (acting as a base) AND alkalis (acting as an acid) ✓'},

{id:'B14a',section:'B',topic:'Energetics I',marks:2,
 q:'<b>Q14(a)</b> Define <i>standard enthalpy change of combustion</i>. [2]',
 a:'<b>Model answer:</b><br>The enthalpy change when ONE MOLE of a substance is completely burned in oxygen ✓<br>under standard conditions (298 K, 100 kPa), all species in their standard states ✓'},

{id:'B14b',section:'B',topic:'Energetics I',marks:3,
 q:'<b>Q14(b)</b> Calculate ΔH for the hydrogenation of ethene: C₂H₄(g)+H₂(g)→C₂H₆(g), using: C=C=612, C–H=412, H–H=436, C–C=348 kJ/mol. [3]',
 a:'<b>Bonds broken:</b><div class="eq">1(C=C) + 4(C–H) + 1(H–H) = 612 + 1648 + 436 = 2696 kJ mol⁻¹</div>✓<b>Bonds made:</b><div class="eq">1(C–C) + 6(C–H) = 348 + 2472 = 2820 kJ mol⁻¹</div>✓<div class="eq">ΔH = 2696 − 2820 = <b>−124 kJ mol⁻¹</b></div>✓<div class="tip">💡 Count H atoms carefully: ethene has 4 C–H bonds, but ethane (product) has 6 C–H bonds — the extra 2 come from the added H₂.</div>'},

{id:'B15a',section:'B',topic:'Stoichiometry',marks:1,
 q:'<b>Q15(a)</b> 25.0 cm³ of a Na₂CO₃ solution needed 23.50 cm³ of 0.100 mol dm⁻³ HCl. Calculate the moles of HCl used. [1]',
 a:'<div class="eq">n(HCl) = 0.100 × (23.50/1000) = <b>2.35×10⁻³ mol</b></div>✓'},

{id:'B15b',section:'B',topic:'Stoichiometry',marks:4,
 q:'<b>Q15(b)</b> 1.25 g of impure Na₂CO₃ was made up to 250 cm³; 25.0 cm³ of this required the HCl above.<br>Na₂CO₃(aq)+2HCl(aq)→2NaCl(aq)+H₂O(l)+CO₂(g)<br>Calculate the % purity of the sample. [4]',
 a:'<div class="eq">n(Na₂CO₃) in 25.0 cm³ = 2.35×10⁻³ / 2 = 1.175×10⁻³ mol ✓ (1:2 ratio)<br>n(Na₂CO₃) in 250 cm³ (×10) = 1.175×10⁻² mol ✓<br>mass Na₂CO₃ = 1.175×10⁻² × 106.0 = 1.2455 g ✓<br>% purity = (1.2455 / 1.25) × 100 = <b>99.6%</b> ✓</div><div class="tip">💡 Two scale-up steps here: first halve for the 1:2 mole ratio, then ×10 to scale from the 25 cm³ sample back up to the full 250 cm³ volumetric flask. Missing either step is the most common lost mark.</div>'},

{id:'B16a',section:'B',topic:'Kinetics',marks:2,
 q:'<b>Q16(a)</b> Rate data table (Exp1: [A]=0.10,[B]=0.10,rate=1.0×10⁻³; Exp2: [A]=0.20,[B]=0.10,rate=4.0×10⁻³; Exp3: [A]=0.20,[B]=0.20,rate=4.0×10⁻³). Deduce the order wrt A and wrt B. [2]',
 a:'<b>Order wrt A: 2</b> ✓ (doubling [A] quadruples the rate)<br><b>Order wrt B: 0</b> ✓ (doubling [B] has no effect on rate)'},

{id:'B16b',section:'B',topic:'Kinetics',marks:2,
 q:'<b>Q16(b)</b> Write the rate equation and calculate k, with units. [2]',
 a:'<div class="eq">Rate = k[A]²<br>k = 1.0×10⁻³ / (0.10)² = <b>0.10</b><br>Units: mol⁻¹ dm³ s⁻¹</div>✓✓'},

{id:'B16c',section:'B',topic:'Kinetics',marks:1,
 q:'<b>Q16(c)</b> Sketch a graph showing how [B] changes with time, given the reaction is zero order with respect to B. [1]',
 a:'<b>Model answer:</b><br>A straight line with a NEGATIVE (constant) gradient — a linear decrease in [B] from its initial value down to zero ✓<div class="tip">💡 Zero order = constant rate of decrease = straight line. This is different from the curved decay shape for a 2nd-order reactant like A in this same question.</div>'},

{id:'B16d',section:'B',topic:'Kinetics',marks:1,
 q:'<b>Q16(d)</b> Explain what is meant by the rate-determining step of a reaction mechanism. [1]',
 a:'<b>Model answer:</b><br>The SLOWEST step in a multi-step reaction mechanism ✓ — it is this step that determines (limits) the overall rate of the whole reaction.'},

{id:'B17a',section:'B',topic:'Equilibrium I',marks:1,
 q:'<b>Q17(a)</b> Write the Kc expression for: N₂(g) + 3H₂(g) ⇌ 2NH₃(g) [1]',
 a:'<div class="eq">Kc = [NH₃]² / ([N₂][H₂]³)</div>✓'},

{id:'B17b',section:'B',topic:'Equilibrium I',marks:4,
 q:'<b>Q17(b)</b> 0.20 mol N₂ + 0.30 mol H₂ in a 1.0 dm³ container reach equilibrium; 0.10 mol NH₃ present at equilibrium. Calculate Kc, with units. [4]',
 a:'<table class="mini"><tr><th></th><th>N₂</th><th>H₂</th><th>NH₃</th></tr><tr><td>Initial</td><td>0.20</td><td>0.30</td><td>0</td></tr><tr><td>Change</td><td>−0.05</td><td>−0.15</td><td>+0.10</td></tr><tr><td>Eqm</td><td>0.15</td><td>0.15</td><td>0.10</td></tr></table>✓✓ (ICE table — NH₃ formed in 1:3:2 ratio, so N₂ used = 0.05, H₂ used = 0.15)<div class="eq">Kc = (0.10)² / (0.15 × 0.15³) = 0.01 / 5.0625×10⁻⁴ = <b>19.8</b><br>Units: mol⁻² dm⁶</div>✓'},

{id:'B17c',section:'B',topic:'Acid-Base',marks:1,
 q:'<b>Q17(c)</b> Calculate the pH of 0.050 mol dm⁻³ sulfuric acid, H₂SO₄. [1]',
 a:'<div class="eq">[H⁺] = 2 × 0.050 = 0.10 mol dm⁻³ (H₂SO₄ is diprotic — 2 H⁺ per formula unit)<br>pH = <b>1.0</b></div>✓<div class="tip">💡 At A Level, assume BOTH protons of H₂SO₄ fully dissociate — always double the concentration before taking the log.</div>'},

{id:'B17d',section:'B',topic:'Acid-Base',marks:3,
 q:'<b>Q17(d)</b> Buffer: 0.20 mol dm⁻³ ethanoic acid + 0.10 mol dm⁻³ sodium ethanoate. Calculate the pH. (Ka = 1.7×10⁻⁵) [3]',
 a:'<div class="eq">pKa = −log(1.7×10⁻⁵) = 4.77 ✓<br>pH = pKa + log([salt]/[acid]) = 4.77 + log(0.10/0.20) ✓<br>= 4.77 − 0.30 = <b>4.47</b> ✓</div>'},

/* ===== SECTION C — EXTENDED RESPONSE ===== */
{id:'C18ai',section:'C',topic:'Energetics II',marks:1,
 q:'<b>Q18(a)(i)</b> Define the term <i>lattice enthalpy of dissociation</i>. [1]',
 a:'<b>Model answer:</b><br>The enthalpy change when ONE MOLE of an ionic compound is converted into its gaseous ions ✓ (always endothermic/positive, since energy must be put in to overcome the electrostatic attraction).'},

{id:'C18aii',section:'C',topic:'Energetics II',marks:4,
 q:'<b>Q18(a)(ii)</b> Draw a fully labelled Born-Haber cycle for the formation of CaF₂(s) from its elements. [4]',
 a:'<b>Cycle steps:</b><br>Ca(s) → Ca(g) — atomisation of Ca ✓<br>Ca(g) → Ca²⁺(g) + 2e⁻ — 1st + 2nd IE of Ca ✓<br>F₂(g) → 2F(g) — atomisation of fluorine ✓<br>2F(g) + 2e⁻ → 2F⁻(g) — electron affinity of F (×2) ✓<br>Ca²⁺(g) + 2F⁻(g) → CaF₂(s) — lattice enthalpy of formation (closes the cycle)'},

{id:'C18aiii',section:'C',topic:'Energetics II',marks:4,
 q:'<b>Q18(a)(iii)</b> Calculate the lattice enthalpy of dissociation of CaF₂ using: ΔH°f=−1220, ΔH°at[Ca]=+193, IE1=+590, IE2=+1145, ΔH°at[F₂]=+158, EA1[F]=−328 (kJ/mol) [4]',
 a:'<div class="eq">−1220 = (+193) + (+590) + (+1145) + (+158) + 2(−328) + ΔH°LE(formation) ✓✓<br>−1220 = 193 + 590 + 1145 + 158 − 656 + ΔH°LE(formation)<br>−1220 = 1430 + ΔH°LE(formation)<br>ΔH°LE(formation) = <b>−2650 kJ mol⁻¹</b></div>✓✓<div class="trap">⚠️ Read the question carefully: this working gives the lattice enthalpy of FORMATION (−2650 kJ mol⁻¹, gaseous ions → solid). Since the question specifically asks for the lattice enthalpy of DISSOCIATION, flip the sign: <b>ΔH°LE(dissociation) = +2650 kJ mol⁻¹</b>. Always state which direction your final answer refers to.</div>'},

{id:'C18bi',section:'C',topic:'Energetics II',marks:2,
 q:'<b>Q18(b)(i)</b> The theoretical LE of CaF₂ (electrostatic theory) differs slightly from the experimental Born-Haber value. Explain why. [2]',

{id:'C18bii',section:'C',topic:'Energetics II',marks:2,
 q:'<b>Q18(b)(ii)</b> ΔH°sol(CaF₂) = −13 kJ/mol. Using your dissociation lattice enthalpy, calculate the sum of the hydration enthalpies of Ca²⁺ and 2F⁻. [2]',

{id:'C19bi',section:'C',topic:'Redox II',marks:1,

{id:'C20ai',section:'C',topic:'Transition Metals',marks:3,

{id:'C20aii',section:'C',topic:'Transition Metals',marks:2,

{id:'C20ci',section:'C',topic:'Equilibrium II',marks:3,
 q:'<b>Q20(c)(i)</b> Contact Process: 2SO₂(g)+O₂(g)⇌2SO₃(g). At equilibrium: p(SO₂)=20 kPa, p(O₂)=10 kPa, p(SO₃)=80 kPa. Write the Kp expression and calculate its value, with units. [3]',

/* ===== STATE ===== */
let currentSection='ALL';
let filtered=[];
let idx=0;
let flipped=false;
let progress=JSON.parse(localStorage.getItem('chemMock4Progress')||'{}');

const sections=[{k:'ALL',l:'All Cards'},{k:'A',l:'Section A · MCQ'},{k:'B',l:'Section B'},{k:'C',l:'Section C'}];

function buildTabs(){
  const wrap=document.getElementById('tabs');
  wrap.innerHTML='';
  sections.forEach(s=>{
    const btn=document.createElement('div');
    btn.className='tab'+(s.k===currentSection?' active':'');
    btn.textContent=s.l;
    btn.onclick=()=>{currentSection=s.k;idx=0;flipped=false;applyFilter();render();};
    wrap.appendChild(btn);
  });
}
function applyFilter(){
  filtered = currentSection==='ALL'? cards.slice() : cards.filter(c=>c.section===currentSection);
}
function flipCard(){flipped=!flipped;render();}
function nextCard(){if(idx<filtered.length-1){idx++;flipped=false;render();}}
function prevCard(){if(idx>0){idx--;flipped=false;render();}}
function shuffleDeck(){
  for(let i=filtered.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[filtered[i],filtered[j]]=[filtered[j],filtered[i]];}
  idx=0;flipped=false;render();
}
function mark(id,status){
  progress[id]=status;
  localStorage.setItem('chemMock4Progress',JSON.stringify(progress));
  render();
}
function resetProgress(){
  if(confirm('Reset all know/review progress?')){progress={};localStorage.setItem('chemMock4Progress','{}');render();}
}
function render(){
  buildTabs();
  const c=filtered[idx];
  const el=document.getElementById('cardEl');
  document.getElementById('counter').textContent = `Card ${idx+1} of ${filtered.length}`;
  document.getElementById('prevBtn').disabled = idx===0;
  document.getElementById('nextBtn').disabled = idx===filtered.length-1;
  const st=progress[c.id];
  el.className='card'+(flipped?' backface':'');
  el.innerHTML=`
    <div class="tagrow">
      <div><span class="qid">${c.id}</span><br><span class="topicchip">${c.topic}</span></div>
      ${c.marks?`<span class="marks">${c.marks} mark${c.marks>1?'s':''}</span>`:''}
    </div>
    <div class="content">${flipped? c.a : c.q}</div>
    <div class="fliphint">${flipped? '↺ tap to see question' : '👆 tap card to reveal answer'}</div>
    <div class="actions">
      <button class="btn review ${st==='review'?'sel':''}" onclick="event.stopPropagation();mark('${c.id}','review')">🔴 Review</button>
      <button class="btn know ${st==='know'?'sel':''}" onclick="event.stopPropagation();mark('${c.id}','know')">🟢 Know it</button>
    </div>`;
  const known=Object.values(progress).filter(v=>v==='know').length;
  const review=Object.values(progress).filter(v=>v==='review').length;
  document.getElementById('statTotal').textContent=cards.length;
  document.getElementById('statKnow').textContent=known;
  document.getElementById('statReview').textContent=review;
  document.getElementById('progressFill').style.width = (Object.keys(progress).length/cards.length*100)+'%';
}

applyFilter();
render();
</script>
